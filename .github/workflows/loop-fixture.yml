# Proof of the writecheck loop worker (corpus.yml) on GitHub, on every pull request that touches it: the same
# steps as the worker, in the same order (test/loop-workflow.test.mjs checks they match), on a fixture shard of
# IsoKron's own servers: tiny-tracker (isokron-ai/mcp-write-safety; catalog, plan and the full write test against
# its in-sandbox backend), kronicle-lite (catalog, plan and the full write test on its own data folder),
# mcp-check (the generic path from tool-qa's seed: the latest npm version, init, plan and catalog), a subject
# with no npm or PyPI package (its skips) and pg-tracker (the fixture of this repository, whose backend is a real
# PostgreSQL server that the sandbox container starts for the full write test: catalog, plan and the full write
# test, every result labelled hermetic; its subject is its own, <repository>.pg-tracker, which the pump's seed does not list) and
# redis-tracker (the same, over a real Redis whose redis-server comes from a digest-pinned official image). The worker-kit then builds each bundle in a dry run (no encryption, no
# upload), and loop/check-bundles.mjs judges each one with tool-qa's own ingest code at the pinned commit: every
# bundle must be accepted, with its controls passed, and each fixture must show what it is known to show.
#
# No secret, no environment, a token with contents: read only, no pull_request_target. A pull request from a fork
# runs nothing here. The plaintext bundles (our own servers' output only) are kept for 7 days for review.

name: loop-fixture

on:
  pull_request:
    paths:
      - .github/workflows/corpus.yml
      - .github/workflows/loop-fixture.yml
      - loop/**
      - dogfood/build-cli.sh
      - dogfood/cli-ref.sh
      - contract.mjs

permissions: {}

concurrency:
  group: loop-fixture-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKER_KIT_REF: '2ffcea16117ec679398f83eefe8c6fa66d38bac6'
  SEED_REF: '2ffcea16117ec679398f83eefe8c6fa66d38bac6'
  SANDBOX_REF: '3738f2c3dabe03e943a1e5ff0a2441aca831e910'
  # isokron-ai/mcp-check at the commit tool-qa's live-probe lane runs (pump/workflows.json, live-probe versions.tool): its
  # resolver chooses an OCI subject's image for this lane too (loop/launch.mjs, WC14), so both lanes run the same image.
  MCP_CHECK_REF: 'bc0faaf34af6fb0d7aec50a149fa5a20ec29d634'

jobs:
  conformance:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: isokron-ai/mcp-surface-corpus/.github/workflows/sandbox-conformance.yml@3738f2c3dabe03e943a1e5ff0a2441aca831e910 # SANDBOX_REF
    with:
      mutations: false
      artifact-prefix: loop-fixture-conformance

  fixture:
    needs: conformance
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.conformance.outputs.verdict == 'pass'
    name: loop-fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - id: inputs
        name: The fixture shard
        run: |
          shard="fixture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          key() { printf '%s' "$1-$shard" | sha256sum | cut -d' ' -f1; }
          items=$(printf '[{"subject":"isokron-ai/mcp-write-safety","run_key":"%s","fence":1},{"subject":"isokron-ai/kronicle-lite","run_key":"%s","fence":2},{"subject":"isokron-ai/mcp-check","run_key":"%s","fence":3},{"subject":"isokron-ai/strapi-plugin-writesafe","run_key":"%s","fence":4},{"subject":"isokron-ai/mcp-writecheck-action.pg-tracker","fixture":"pg-tracker","run_key":"%s","fence":5},{"subject":"isokron-ai/mcp-writecheck-action.redis-tracker","fixture":"redis-tracker","run_key":"%s","fence":6}]' "$(key tt)" "$(key kl)" "$(key mc)" "$(key sw)" "$(key pg)" "$(key rd)")
          {
            echo "shard_id=$shard"
            echo "attempt_id=$shard"
            echo "items=$items"
            echo "tool_sha="
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.inputs.outputs.tool_sha || github.sha }}
      # tool-qa R-PIN-01 (R-WC-28): the lane code is the commit the pump pinned (tool_sha), else this run's own commit; the
      # job stops unless the checkout is exactly that commit, and the driver reports it as the mcp-writecheck-action that ran.
      - name: The checkout is the commit to run
        env:
          TOOL_SHA: ${{ steps.inputs.outputs.tool_sha }}
        run: |
          head=$(git rev-parse HEAD)
          want="${TOOL_SHA:-$GITHUB_SHA}"
          if [ "$head" != "$want" ]; then echo "::error title=writecheck::the checkout is not the commit to run"; exit 1; fi
          echo "ACTION_SHA=$head" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check the items in full
        env:
          ITEMS: ${{ steps.inputs.outputs.items }}
        run: node --input-type=module -e 'import { parseItems } from "./loop/items.mjs"; console.log(parseItems(process.env.ITEMS).length + " item(s)")'
      - name: Choose the CLI commit
        run: dogfood/cli-ref.sh
      # The CLI first, before any third-party code runs in this job; then the sandbox's own code and the seed.
      - name: Fetch and build
        run: loop/prepare.sh fetch
      # gVisor, the firewall and the hostile self test on this very runner, before any target; the step fails
      # unless the telemetry check recomputes a pass.
      - id: sandbox
        name: Sandbox guard (gVisor, firewall, self test)
        uses: isokron-ai/mcp-surface-corpus/sandbox-guard@3738f2c3dabe03e943a1e5ff0a2441aca831e910 # SANDBOX_REF
      - name: The guard ran the pinned sandbox and passed
        env:
          VERDICT: ${{ steps.sandbox.outputs.verdict }}
          GUARD_SHA: ${{ steps.sandbox.outputs.sandbox-sha }}
        run: |
          [ "$VERDICT" = pass ] || { echo "::error::the sandbox self test did not pass"; exit 1; }
          [ "$GUARD_SHA" = "$SANDBOX_REF" ] || { echo "::error::the sandbox guard ran another commit than SANDBOX_REF"; exit 1; }
          [ "$(git -C msc rev-parse HEAD)" = "$SANDBOX_REF" ] || { echo "::error::the driver's sandbox checkout is not SANDBOX_REF"; exit 1; }
      - id: run
        name: Run the items in the sandbox
        env:
          SHARD_ID: ${{ steps.inputs.outputs.shard_id }}
          ATTEMPT_ID: ${{ steps.inputs.outputs.attempt_id }}
          ITEMS: ${{ steps.inputs.outputs.items }}
        run: |
          # --mck only when the checkout's own loop/prepare.sh fetched the resolver: this YAML runs from main while the
          # lane code may be an older pinned commit (tool_sha), whose driver does not take --mck (WC14).
          mck=(); if [ -d mck/corpus ]; then mck=(--mck mck); fi
          node loop/run-items.mjs --msc msc "${mck[@]}" --cli "$MWSC_CLI_PATH" --seed toolqa/history/seed-v1.json --out "$RUNNER_TEMP/wc" --lane ci
      - id: teardown
        name: End the sandbox before anything is sealed
        if: ${{ !cancelled() }}
        run: loop/teardown.sh
      - name: Loop unit tests against the pinned sandbox's and resolver's exports
        if: ${{ !cancelled() }}
        env:
          MSC_DIR: msc
          MCK_DIR: mck
        run: node --test test/loop.test.mjs test/launch.test.mjs
      - id: kit0
        name: Build bundle 0 (dry run)
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_0 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@2ffcea16117ec679398f83eefe8c6fa66d38bac6 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/0/bundle
          meta-file: ${{ runner.temp }}/wc/0/meta.json
          attempt-id: ${{ steps.inputs.outputs.attempt_id }}
          item-index: '0'
          fence: ${{ steps.run.outputs.fence_0 }}
          run-key: ${{ steps.run.outputs.run_key_0 }}
          dry-run: 'true'
      - id: kit1
        name: Build bundle 1 (dry run)
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_1 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@2ffcea16117ec679398f83eefe8c6fa66d38bac6 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/1/bundle
          meta-file: ${{ runner.temp }}/wc/1/meta.json
          attempt-id: ${{ steps.inputs.outputs.attempt_id }}
          item-index: '1'
          fence: ${{ steps.run.outputs.fence_1 }}
          run-key: ${{ steps.run.outputs.run_key_1 }}
          dry-run: 'true'
      - id: kit2
        name: Build bundle 2 (dry run)
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_2 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@2ffcea16117ec679398f83eefe8c6fa66d38bac6 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/2/bundle
          meta-file: ${{ runner.temp }}/wc/2/meta.json
          attempt-id: ${{ steps.inputs.outputs.attempt_id }}
          item-index: '2'
          fence: ${{ steps.run.outputs.fence_2 }}
          run-key: ${{ steps.run.outputs.run_key_2 }}
          dry-run: 'true'
      - id: kit3
        name: Build bundle 3 (dry run)
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_3 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@2ffcea16117ec679398f83eefe8c6fa66d38bac6 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/3/bundle
          meta-file: ${{ runner.temp }}/wc/3/meta.json
          attempt-id: ${{ steps.inputs.outputs.attempt_id }}
          item-index: '3'
          fence: ${{ steps.run.outputs.fence_3 }}
          run-key: ${{ steps.run.outputs.run_key_3 }}
          dry-run: 'true'
      - id: kit4
        name: Build bundle 4 (dry run)
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_4 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@2ffcea16117ec679398f83eefe8c6fa66d38bac6 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/4/bundle
          meta-file: ${{ runner.temp }}/wc/4/meta.json
          attempt-id: ${{ steps.inputs.outputs.attempt_id }}
          item-index: '4'
          fence: ${{ steps.run.outputs.fence_4 }}
          run-key: ${{ steps.run.outputs.run_key_4 }}
          dry-run: 'true'
      - id: kit5
        name: Build bundle 5 (dry run)
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_5 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@2ffcea16117ec679398f83eefe8c6fa66d38bac6 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/5/bundle
          meta-file: ${{ runner.temp }}/wc/5/meta.json
          attempt-id: ${{ steps.inputs.outputs.attempt_id }}
          item-index: '5'
          fence: ${{ steps.run.outputs.fence_5 }}
          run-key: ${{ steps.run.outputs.run_key_5 }}
          dry-run: 'true'
      - name: Fetch tool-qa's ingest at the pinned commit
        if: ${{ !cancelled() && steps.run.outputs.controls_ok == 'true' }}
        run: |
          git init -q toolqa-ingest
          git -C toolqa-ingest remote add origin https://github.com/isokron-ai/tool-qa.git
          git -C toolqa-ingest sparse-checkout set --no-cone /ingest/ /worker-kit/ /scripts/lib/
          git -C toolqa-ingest fetch -q --depth 1 --filter=blob:none origin "$WORKER_KIT_REF"
          git -C toolqa-ingest -c advice.detachedHead=false checkout -q FETCH_HEAD
          [ "$(git -C toolqa-ingest rev-parse HEAD)" = "$WORKER_KIT_REF" ]
      - name: Judge the bundles as tool-qa's ingest does
        if: ${{ !cancelled() && steps.run.outputs.controls_ok == 'true' }}
        env:
          ATTEMPT_ID: ${{ steps.inputs.outputs.attempt_id }}
          ITEMS: ${{ steps.inputs.outputs.items }}
          BUNDLE_0: ${{ steps.kit0.outputs.bundle-path }}
          BUNDLE_1: ${{ steps.kit1.outputs.bundle-path }}
          BUNDLE_2: ${{ steps.kit2.outputs.bundle-path }}
          BUNDLE_3: ${{ steps.kit3.outputs.bundle-path }}
          BUNDLE_4: ${{ steps.kit4.outputs.bundle-path }}
          BUNDLE_5: ${{ steps.kit5.outputs.bundle-path }}
        run: node loop/check-bundles.mjs --toolqa toolqa-ingest
      - name: Keep the plaintext bundles and the shard record (7 days)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loop-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wc/
            ${{ runner.temp }}/tool-qa-result/
            ${{ runner.temp }}/sandbox-selftest/telemetry.jsonl
          if-no-files-found: warn
          retention-days: 7
