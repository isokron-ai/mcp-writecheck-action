# T0 worker: dispatch only (no schedule, push or pull_request). Comments below that say nightly or automatic
# describe the earlier setup; see the README section "T0 workers".
#
# Dogfood: this action against writesafe (strapi-plugin-writesafe-mcp), IsoKron's Strapi 5 plugin.
#
# The job checks out the public plugin repository at a pinned commit, builds its test app with the
# plugin installed from the packed tarball (the plugin repository's own ci/prepare_app.sh), starts
# Strapi 5.62.0 on SQLite inside the runner, seeds test data and runs the action.
#
#   plan  on: the plan and its hash (tools/list only; nothing is written).
#   full  on: the plan, the catalog and the full run (mode full, fail-on must) against the same throwaway
#         Strapi; the plan hash must match the one pinned below.
#
# Security: no pull_request_target; nightly schedule and dispatch only (see `on:`). No secret is used:
# isokron-ai/mcp-write-safety is public, so the checkout of the CLI needs no token; the action gets the
# built CLI through cli-path.
# Third-party actions are pinned by full SHA.
#
# The sandbox: the app's install and build, Strapi itself, the seeding (with the plugin's own token script) and the CLI
# run inside isokron-ai/mcp-surface-corpus's sandbox at SANDBOX_REF, the one the writecheck lane (corpus.yml) uses,
# through dogfood/sbx.mjs: gVisor, user 65534, no capability, a read-only root, no runner environment; the install
# reaches registry.npmjs.org only, through the allowlist proxy, and the run has no network out at all. Strapi is a
# service at 10.213.53.5 of the run network, reached from the unit (the CLI's container) as 127.0.0.1:4812, as the
# manifest says. Every Strapi credential is made inside the sandbox, for a Strapi nothing outside it can reach. The
# reusable sandbox-conformance job and, on each job's own runner, the sandbox-guard action pass first, both at
# SANDBOX_REF. The sealed bundle is built by t0-manifest, another job that runs none of this code.

name: "dogfood: writesafe"

run-name: shard ${{ inputs.shard_id }}

on:
  # Dispatch only: a T0 worker. There is no schedule, push or pull_request trigger.
  workflow_dispatch:
    inputs:
      shard_id:
        description: T0 shard id (letters, digits, dot, underscore, hyphen; at most 64).
        required: true
        type: string
      attempt_id:
        description: Attempt id (same character set). Names the result artifact result-<attempt_id>-0.tar.age.
        required: true
        type: string
      fence:
        description: Fence token (letters, digits, dot, colon, underscore, hyphen; at most 64).
        required: true
        type: string
      run_key:
        description: Run key (same character set as fence).
        required: true
        type: string
      cli-ref:
        description: mcp-writecheck commit to test with (full 40-character SHA). Empty for the action's default.
        required: false
        default: ''
      plan-hashes:
        description: "Accepted plan hashes for that CLI, after reading the plans: space-separated job=hash pairs (jobs: plan, full)."
        required: false
        default: ''

  # The pull-request proof (dogfood-sandbox-proof.yml) calls this same file: proof true builds the bundle in a dry run
  # (no encryption, no upload). The dispatch inputs it does not pass are empty, so the pinned defaults run.
  workflow_call:
    inputs:
      shard_id: { type: string, required: true }
      attempt_id: { type: string, required: true }
      fence: { type: string, required: true }
      run_key: { type: string, required: true }
      proof: { type: boolean, required: false, default: false }
permissions: {}

concurrency:
  group: dogfood-writesafe-${{ github.ref }}-${{ inputs.shard_id }}-${{ inputs.attempt_id }}
  cancel-in-progress: false

env:
  # isokron-ai/mcp-surface-corpus main at 3738f2c, the commit its nightly conformance tests (as corpus.yml). The
  # conformance job and the sandbox-guard step name this same commit (test/dogfood-sandbox.test.mjs checks).
  SANDBOX_REF: '3738f2c3dabe03e943a1e5ff0a2441aca831e910'
  # isokron-ai/strapi-plugin-writesafe main 7120917 (16 Nov: the public sync of source db70c56, which adds #45, #46 and
  # #48, the schema cache and descriptions, to the self-test fixes and X4).
  WS_REF: 71209177a83a0114d5cfa55c89221b9ca1ebec63
  STRAPI_VERSION: 5.62.0
  STRAPI_TELEMETRY_DISABLED: 'true'
  DO_NOT_TRACK: '1'
  PLAN_HASHES: ${{ inputs.plan-hashes }}

jobs:
  t0-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      go: ${{ steps.guard.outputs.go }}
      attempt_id: ${{ steps.guard.outputs.attempt_id }}
      fence: ${{ steps.guard.outputs.fence }}
      run_key: ${{ steps.guard.outputs.run_key }}
    steps:
      - id: guard
        name: Kill switch, then validate the inputs
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          IN_SHARD_ID: ${{ inputs.shard_id }}
          IN_ATTEMPT_ID: ${{ inputs.attempt_id }}
          IN_FENCE: ${{ inputs.fence }}
          IN_RUN_KEY: ${{ inputs.run_key }}
        run: |
          if [ "$LOOP_ENABLED" != "true" ]; then
            echo "::notice::LOOP_ENABLED is not 'true'; this T0 worker does nothing."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bad=0
          check() { # name value pattern
            # [[ =~ ]] matches the whole string, so a value with a newline is refused (grep matched line by line).
            if ! [[ "$2" =~ $3 ]]; then echo "::error::input $1 is empty or has a character outside its allowed set"; bad=1; fi
          }
          check shard_id "$IN_SHARD_ID" '^[A-Za-z0-9._-]{1,64}$'
          check attempt_id "$IN_ATTEMPT_ID" '^[A-Za-z0-9._-]{1,64}$'
          check fence "$IN_FENCE" '^[A-Za-z0-9._:-]{1,64}$'
          check run_key "$IN_RUN_KEY" '^[A-Za-z0-9._:-]{1,64}$'
          [ "$bad" -eq 0 ] || exit 1
          {
            echo "go=true"
            echo "attempt_id=$IN_ATTEMPT_ID"
            echo "fence=$IN_FENCE"
            echo "run_key=$IN_RUN_KEY"
          } >> "$GITHUB_OUTPUT"

  # The sandbox proven on today's runner image before any job that runs third-party code starts.
  conformance:
    needs: t0-start
    if: needs.t0-start.outputs.go == 'true'
    permissions:
      contents: read
    uses: isokron-ai/mcp-surface-corpus/.github/workflows/sandbox-conformance.yml@3738f2c3dabe03e943a1e5ff0a2441aca831e910 # SANDBOX_REF
    with:
      mutations: false
      artifact-prefix: dogfood-writesafe-conformance

  plan:
    needs: [t0-start, conformance]
    if: needs.t0-start.outputs.go == 'true' && needs.conformance.outputs.verdict == 'pass'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MSC_DIR: msc
      PLAN_HASH: ffe01fe92802bad1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The CLI first, before any third-party code runs in this job (public repository, no token).
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Fetch the sandbox (SANDBOX_REF)
        run: loop/prepare.sh sandbox
      - name: Check out writesafe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/strapi-plugin-writesafe
          ref: ${{ env.WS_REF }}
          path: ws
          persist-credentials: false
      # gVisor, the firewall and the hostile self test on this very runner, before any third-party code runs.
      - id: sandbox
        name: Sandbox guard (gVisor, firewall, self test)
        uses: isokron-ai/mcp-surface-corpus/sandbox-guard@3738f2c3dabe03e943a1e5ff0a2441aca831e910 # SANDBOX_REF
      - name: The guard ran the pinned sandbox and passed
        env:
          VERDICT: ${{ steps.sandbox.outputs.verdict }}
          GUARD_SHA: ${{ steps.sandbox.outputs.sandbox-sha }}
        run: dogfood/sandbox-guarded.sh
      - name: Sandbox up (the workspace mirrored into it; 127.0.0.1:4812 is Strapi at .5)
        run: node dogfood/sbx.mjs up --fwd 4812=5:4812
      # The app's npm install runs its packages' install scripts (better-sqlite3 compiles from source against the
      # build image's own Node headers: its prebuilt download is not on the allowlist). registry.npmjs.org only.
      - name: Build the test app (in the sandbox)
        run: node dogfood/sbx.mjs build --image node22-build --hosts registry.npmjs.org --cwd . --minutes 25 --env STRAPI_VERSION="$STRAPI_VERSION" -- dogfood/writesafe/strapi.sh prepare
      - name: The app's configuration and the first admin's credentials (in the sandbox)
        run: node dogfood/sbx.mjs exec -- dogfood/writesafe/strapi.sh env
      - name: Start Strapi (a service of the sandbox's run network)
        run: >-
          node dogfood/sbx.mjs svc --name strapi --ip 5 --image node22 --cwd "$RUNNER_TEMP/ws-app" --wrap
          --env HOST=0.0.0.0 --env PORT=4812 --env NODE_ENV=test --env SERVE_ADMIN_PANEL=false
          --env STRAPI_TELEMETRY_DISABLED=true --env DO_NOT_TRACK=1
          -- node --max-old-space-size=1792 node_modules/@strapi/strapi/bin/strapi.js start
      - name: Seed test data and make the tokens (in the sandbox)
        run: node dogfood/sbx.mjs exec -- dogfood/writesafe/strapi.sh seed
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: dogfood/writesafe/writecheck.yaml
          mode: plan
          artifact-name: writesafe-plan
          cli-path: dogfood/sbx-cli
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" plan
      - name: Strapi's log, when a step failed
        if: failure()
        run: node dogfood/sbx.mjs logs strapi 120
      - name: End the sandbox
        if: always()
        run: node dogfood/sbx.mjs down
      - name: Stop Docker, and check nothing of the sandbox is left
        if: always()
        run: loop/teardown.sh

  # Full mode against the plugin at WS_REF, whose self-test fixes are merged and synced. Everything it
  # writes goes to the job's own throwaway Strapi (SQLite in the runner, test data only). PLAN_HASH is the
  # full job's plan, read before it was pinned.
  full:
    needs: [t0-start, conformance]
    if: needs.t0-start.outputs.go == 'true' && needs.conformance.outputs.verdict == 'pass'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MSC_DIR: msc
      PLAN_HASH: ffe01fe92802bad1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The CLI first, before any third-party code runs in this job (public repository, no token).
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Fetch the sandbox (SANDBOX_REF)
        run: loop/prepare.sh sandbox
      - name: Check out writesafe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/strapi-plugin-writesafe
          ref: ${{ env.WS_REF }}
          path: ws
          persist-credentials: false
      # gVisor, the firewall and the hostile self test on this very runner, before any third-party code runs.
      - id: sandbox
        name: Sandbox guard (gVisor, firewall, self test)
        uses: isokron-ai/mcp-surface-corpus/sandbox-guard@3738f2c3dabe03e943a1e5ff0a2441aca831e910 # SANDBOX_REF
      - name: The guard ran the pinned sandbox and passed
        env:
          VERDICT: ${{ steps.sandbox.outputs.verdict }}
          GUARD_SHA: ${{ steps.sandbox.outputs.sandbox-sha }}
        run: dogfood/sandbox-guarded.sh
      - name: Sandbox up (the workspace mirrored into it; 127.0.0.1:4812 is Strapi at .5)
        run: node dogfood/sbx.mjs up --fwd 4812=5:4812
      # The app's npm install runs its packages' install scripts (better-sqlite3 compiles from source against the
      # build image's own Node headers: its prebuilt download is not on the allowlist). registry.npmjs.org only.
      - name: Build the test app (in the sandbox)
        run: node dogfood/sbx.mjs build --image node22-build --hosts registry.npmjs.org --cwd . --minutes 25 --env STRAPI_VERSION="$STRAPI_VERSION" -- dogfood/writesafe/strapi.sh prepare
      - name: The app's configuration and the first admin's credentials (in the sandbox)
        run: node dogfood/sbx.mjs exec -- dogfood/writesafe/strapi.sh env
      - name: Start Strapi (a service of the sandbox's run network)
        run: >-
          node dogfood/sbx.mjs svc --name strapi --ip 5 --image node22 --cwd "$RUNNER_TEMP/ws-app" --wrap
          --env HOST=0.0.0.0 --env PORT=4812 --env NODE_ENV=test --env SERVE_ADMIN_PANEL=false
          --env STRAPI_TELEMETRY_DISABLED=true --env DO_NOT_TRACK=1
          -- node --max-old-space-size=1792 node_modules/@strapi/strapi/bin/strapi.js start
      - name: Seed test data and make the tokens (in the sandbox)
        run: node dogfood/sbx.mjs exec -- dogfood/writesafe/strapi.sh seed
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: dogfood/writesafe/writecheck.yaml
          mode: plan
          artifact-name: writesafe-full-plan
          cli-path: dogfood/sbx-cli
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" full
      - name: Catalog
        uses: ./
        with:
          manifest: dogfood/writesafe/writecheck.yaml
          mode: catalog
          fail-on: must
          artifact-name: writesafe-catalog
          cli-path: dogfood/sbx-cli
      - name: Full run
        uses: ./
        with:
          manifest: dogfood/writesafe/writecheck.yaml
          mode: full
          fail-on: must
          confirm-target: writesafe-dogfood-strapi-5.62.0
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: writesafe-full
          cli-path: dogfood/sbx-cli
      - name: Strapi's log, when a step failed
        if: failure()
        run: node dogfood/sbx.mjs logs strapi 120
      - name: End the sandbox
        if: always()
        run: node dogfood/sbx.mjs down
      - name: Stop Docker, and check nothing of the sandbox is left
        if: always()
        run: loop/teardown.sh

  t0-manifest:
    needs: [t0-start, conformance, plan, full]
    if: ${{ always() && needs.t0-start.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Runs none of the workflow's code: it only reads the jobs' results (and, for a failed run, which steps failed) and builds the sealed bundle.
    permissions:
      contents: read
      actions: read # the failed steps of this run, to tell infrastructure from our tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the result bundle
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          node loop/t0-bundle.mjs --out "$RUNNER_TEMP/out"
      - uses: isokron-ai/tool-qa/worker-kit@b04b7c65c244de48c32f93c7ea9b9ac933ca1efe # tool-qa main, 27 Nov 2026 (T0_WORKER_KIT_REF)
        with:
          bundle-dir: ${{ runner.temp }}/out/bundle
          meta-file: ${{ runner.temp }}/out/meta.json
          attempt-id: ${{ needs.t0-start.outputs.attempt_id }}
          item-index: 0
          fence: ${{ needs.t0-start.outputs.fence }}
          run-key: ${{ needs.t0-start.outputs.run_key }}
          dry-run: ${{ inputs.proof && 'true' || 'false' }}
