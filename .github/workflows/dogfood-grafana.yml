# T0 worker: dispatch only (no schedule, push or pull_request). Comments below that say nightly or automatic
# describe the earlier setup; see the README section "T0 workers".
#
# Dogfood: this action against IsoKron's research build of the Grafana MCP server (the fork
# isokron-ai/mcp-grafana, branch iso/write-path), every night and on demand.
#
#   research  the fork at a pinned commit, built with Go, against a disposable Grafana 13.3.0
#             (docker, loopback only) started in the job: plan, catalog, then a full run. Snapshots
#             of what the tester did not create are taken before and after, and must match. The
#             violated MUST records must be the known ones (dogfood/grafana/known-violations.txt).
#   vendor    the upstream build (image grafana/mcp-grafana:2.2.0). DISABLED: it needs the owner's
#             go. Job logs and summaries of this repository are public, and not every upstream
#             finding has been reported yet.
#
# The plan hash below was read and accepted by a person (the action's rule: never take a hash from
# a plan job's output). When the fork commit, the manifest, Grafana or the CLI pin changes, the hash
# check fails: read the new plan in the plan step's summary and update PLAN_HASH.
#
# Security: no pull_request_target. A pull request from a fork runs nothing here (each job's `if:`).
# No secret is used: isokron-ai/mcp-write-safety is public, so the "Check out mcp-writecheck" step
# needs no token; the action gets the built CLI through cli-path. Third-party actions are pinned by full SHA.
# The Grafana admin password and the service-account token are made in the job, checked and masked.

name: "dogfood: grafana"

run-name: shard ${{ inputs.shard_id }}

on:
  # Dispatch only: a T0 worker. There is no schedule, push or pull_request trigger.
  workflow_dispatch:
    inputs:
      shard_id:
        description: T0 shard id (letters, digits, dot, underscore, hyphen; at most 64).
        required: true
        type: string
      attempt_id:
        description: Attempt id (same character set). Names the result artifact result-<attempt_id>-0.tar.age.
        required: true
        type: string
      fence:
        description: Fence token (letters, digits, dot, colon, underscore, hyphen; at most 64).
        required: true
        type: string
      run_key:
        description: Run key (same character set as fence).
        required: true
        type: string
      cli-ref:
        description: mcp-writecheck commit to test with (full 40-character SHA). Empty for the action's default.
        required: false
        default: ''
      plan-hashes:
        description: "Accepted plan hashes for that CLI, after reading the plans: space-separated job=hash pairs (job names as in this file)."
        required: false
        default: ''

permissions: {}

concurrency:
  group: dogfood-grafana-${{ github.ref }}-${{ inputs.shard_id }}-${{ inputs.attempt_id }}
  cancel-in-progress: false

env:
  PLAN_HASHES: ${{ inputs.plan-hashes }}
  # isokron-ai/mcp-grafana, branch iso/write-path.
  FORK_REF: e551ab8bdbb2fe0daf3eb714ef6fbc03ad859ee0
  GRAFANA_IMAGE: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
  # The same URL in every step, so that every step arrives at the same plan hash.
  GRAFANA_URL: http://127.0.0.1:4930

jobs:
  t0-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      go: ${{ steps.guard.outputs.go }}
      attempt_id: ${{ steps.guard.outputs.attempt_id }}
      fence: ${{ steps.guard.outputs.fence }}
      run_key: ${{ steps.guard.outputs.run_key }}
    steps:
      - id: guard
        name: Kill switch, then validate the inputs
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          IN_SHARD_ID: ${{ inputs.shard_id }}
          IN_ATTEMPT_ID: ${{ inputs.attempt_id }}
          IN_FENCE: ${{ inputs.fence }}
          IN_RUN_KEY: ${{ inputs.run_key }}
        run: |
          if [ "$LOOP_ENABLED" != "true" ]; then
            echo "::notice::LOOP_ENABLED is not 'true'; this T0 worker does nothing."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bad=0
          check() { # name value pattern
            # [[ =~ ]] matches the whole string, so a value with a newline is refused (grep matched line by line).
            if ! [[ "$2" =~ $3 ]]; then echo "::error::input $1 is empty or has a character outside its allowed set"; bad=1; fi
          }
          check shard_id "$IN_SHARD_ID" '^[A-Za-z0-9._-]{1,64}$'
          check attempt_id "$IN_ATTEMPT_ID" '^[A-Za-z0-9._-]{1,64}$'
          check fence "$IN_FENCE" '^[A-Za-z0-9._:-]{1,64}$'
          check run_key "$IN_RUN_KEY" '^[A-Za-z0-9._:-]{1,64}$'
          [ "$bad" -eq 0 ] || exit 1
          {
            echo "go=true"
            echo "attempt_id=$IN_ATTEMPT_ID"
            echo "fence=$IN_FENCE"
            echo "run_key=$IN_RUN_KEY"
          } >> "$GITHUB_OUTPUT"

  research:
    needs: t0-start
    permissions:
      contents: read
    if: needs.t0-start.outputs.go == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAN_HASH: 'a5334ce86dd65834'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CLI first, before any server or third-party code runs in this job (public repository, no token).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Check out the research build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-grafana
          ref: ${{ env.FORK_REF }}
          path: srv-grafana
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: srv-grafana/go.mod
          cache: false
      - name: Build the research build
        working-directory: srv-grafana
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o ../grafana-bin/mcp-grafana ./cmd/mcp-grafana
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Start Grafana
        run: dogfood/grafana/grafana.sh start
      - name: Fixtures and bystanders
        run: dogfood/grafana/grafana.sh fixtures
      - name: Snapshot before
        run: dogfood/grafana/grafana.sh snap "$RUNNER_TEMP/snap-before.json"
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: dogfood/grafana/writecheck.yaml
          mode: plan
          artifact-name: grafana-research-plan
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" research
      - name: Catalog
        uses: ./
        with:
          manifest: dogfood/grafana/writecheck.yaml
          mode: catalog
          fail-on: must
          artifact-name: grafana-research-catalog
          cli-path: ${{ env.MWSC_CLI_PATH }}
      # fail-on: none, because the research build gives violated MUST records that are known and
      # recorded (dogfood/grafana/known-violations.txt); the next step fails the job on any other.
      # The action still fails this step on its own safety rules: a lost bystander, setup not
      # released, an unfinished clean-up, or a run that did not complete.
      - id: full
        name: Full run
        uses: ./
        with:
          manifest: dogfood/grafana/writecheck.yaml
          mode: full
          fail-on: none
          confirm-target: mwsv-grafana-13
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: grafana-research-full
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Violated MUST records against the known ones
        if: always() && steps.full.outputs.results-path != ''
        env:
          RESULTS: ${{ steps.full.outputs.results-path }}
        run: node dogfood/expect-violations.mjs dogfood/grafana/known-violations.txt "$RESULTS"
      - name: Snapshot after, and compare
        if: always() && steps.plan.outcome == 'success'
        run: |
          dogfood/grafana/grafana.sh snap "$RUNNER_TEMP/snap-after.json"
          dogfood/grafana/compare-snaps.py "$RUNNER_TEMP/snap-before.json" "$RUNNER_TEMP/snap-after.json"
      - name: Stop Grafana
        if: always()
        run: dogfood/grafana/grafana.sh stop

  vendor:
    needs: t0-start
    permissions:
      contents: read
    # DISABLED: needs the owner's go. Logs and job summaries here are public, and some upstream
    # findings are not reported yet. To enable: remove this `if`, run once, read the plan in the
    # plan step's summary, and pin its hash in PLAN_HASH.
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAN_HASH: '0000000000000000'
      VENDOR_IMAGE: grafana/mcp-grafana:2.2.0@sha256:697336440e34878f8e0b26a69675db8d7e97b4d0daec25ec5441c85ac6c60e81
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CLI first, before any server or third-party code runs in this job (public repository, no token).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Take the upstream binary from its image
        run: |
          mkdir -p grafana-bin
          docker create --name dogfood-grafana-vendor "$VENDOR_IMAGE" > /dev/null
          docker cp dogfood-grafana-vendor:/app/mcp-grafana grafana-bin/mcp-grafana-vendor
          docker rm dogfood-grafana-vendor > /dev/null
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Start Grafana
        run: dogfood/grafana/grafana.sh start
      - name: Fixtures and bystanders
        run: dogfood/grafana/grafana.sh fixtures
      - name: Snapshot before
        run: dogfood/grafana/grafana.sh snap "$RUNNER_TEMP/snap-before.json"
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: dogfood/grafana/writecheck-vendor.yaml
          mode: plan
          artifact-name: grafana-vendor-plan
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" vendor
      - name: Full run
        uses: ./
        with:
          manifest: dogfood/grafana/writecheck-vendor.yaml
          mode: full
          fail-on: must
          confirm-target: mwsv-grafana-13
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: grafana-vendor-full
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Snapshot after, and compare
        if: always() && steps.plan.outcome == 'success'
        run: |
          dogfood/grafana/grafana.sh snap "$RUNNER_TEMP/snap-after.json"
          dogfood/grafana/compare-snaps.py "$RUNNER_TEMP/snap-before.json" "$RUNNER_TEMP/snap-after.json"
      - name: Stop Grafana
        if: always()
        run: dogfood/grafana/grafana.sh stop

  t0-manifest:
    needs: [t0-start, research, vendor]
    if: ${{ always() && needs.t0-start.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Runs none of the workflow's code: it only reads the jobs' results and builds the sealed bundle.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the result bundle
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          node loop/t0-bundle.mjs --out "$RUNNER_TEMP/out"
      - uses: isokron-ai/tool-qa/worker-kit@b04b7c65c244de48c32f93c7ea9b9ac933ca1efe # tool-qa main, 27 Nov 2026 (T0_WORKER_KIT_REF)
        with:
          bundle-dir: ${{ runner.temp }}/out/bundle
          meta-file: ${{ runner.temp }}/out/meta.json
          attempt-id: ${{ needs.t0-start.outputs.attempt_id }}
          item-index: 0
          fence: ${{ needs.t0-start.outputs.fence }}
          run-key: ${{ needs.t0-start.outputs.run_key }}
