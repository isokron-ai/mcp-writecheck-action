# T0 worker: dispatch only (no schedule, push or pull_request). Comments below that say nightly or automatic
# describe the earlier setup; see the README section "T0 workers".
#
# Dogfood: this action against the Kubernetes MCP server research build, every night and on demand.
#
#   research  isokron-ai/kubernetes-mcp-writepath-experiment: v0.1.2 plus the experiment's bug-fix and usability
#             patches, built from source with the experiment's harness/build/build.sh (which checks the patched
#             tree against the tag research-v0.1.2). Backend: a disposable kind cluster made inside the job
#             (dogfood/kubernetes/up.sh), with fixtures (seed.sh). Plan, catalog, then a full run with fail-on: must.
#   vendor    the upstream v0.1.2 release. DISABLED: it needs the owner's go before it runs here, because this
#             repository's job logs and summaries are public and some findings on upstream builds are unreported.
#
# The plan hash was read and accepted by a person (never taken from a plan step's output). When the experiment pin,
# the manifest or the CLI pin changes, the full run is refused: read the new plan in the plan step's summary and update
# PLAN_HASH.
#
# Security: no pull_request_target. A pull request from a fork runs nothing here (each job's `if:`).
# No secret is used: isokron-ai/mcp-write-safety is public, so the "Check out mcp-writecheck" step
# needs no token; the action gets the built CLI through cli-path. Third-party actions are pinned by full SHA.
# The cluster's only credential is a service-account token minted in the job, written to a file and masked.

name: "dogfood: kubernetes"

run-name: shard ${{ inputs.shard_id }}

on:
  # Dispatch only: a T0 worker. There is no schedule, push or pull_request trigger.
  workflow_dispatch:
    inputs:
      shard_id:
        description: T0 shard id (letters, digits, dot, underscore, hyphen; at most 64).
        required: true
        type: string
      attempt_id:
        description: Attempt id (same character set). Names the result artifact result-<attempt_id>-0.tar.age.
        required: true
        type: string
      fence:
        description: Fence token (letters, digits, dot, colon, underscore, hyphen; at most 64).
        required: true
        type: string
      run_key:
        description: Run key (same character set as fence).
        required: true
        type: string
      cli-ref:
        description: mcp-writecheck commit to test with (full 40-character SHA). Empty for the action's default.
        required: false
        default: ''
      plan-hashes:
        description: "Accepted plan hashes for that CLI, after reading the plans: space-separated job=hash pairs (job names as in this file)."
        required: false
        default: ''

permissions: {}

concurrency:
  group: dogfood-kubernetes-${{ github.ref }}-${{ inputs.shard_id }}-${{ inputs.attempt_id }}
  cancel-in-progress: false

env:
  PLAN_HASHES: ${{ inputs.plan-hashes }}
  # isokron-ai/kubernetes-mcp-writepath-experiment main (its harness and the tags upstream-v0.1.2 and research-v0.1.2).
  EXP_REF: eddb5c72f591709cbc2c4a92f0fb350e1e475c5b
  # The experiment's harness/build/PIN: KIND_VERSION, and the Go release the measured builds used.
  KIND_VERSION: v0.33.0
  GO_VERSION: '1.26.11'
  # The same loopback proxies in every step, so that every step arrives at the same plan hash.
  MWSV_K8S_API: http://127.0.0.1:4902
  MWSV_K8S_CONTROL: http://127.0.0.1:4903

jobs:
  t0-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      go: ${{ steps.guard.outputs.go }}
      attempt_id: ${{ steps.guard.outputs.attempt_id }}
      fence: ${{ steps.guard.outputs.fence }}
      run_key: ${{ steps.guard.outputs.run_key }}
    steps:
      - id: guard
        name: Kill switch, then validate the inputs
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          IN_SHARD_ID: ${{ inputs.shard_id }}
          IN_ATTEMPT_ID: ${{ inputs.attempt_id }}
          IN_FENCE: ${{ inputs.fence }}
          IN_RUN_KEY: ${{ inputs.run_key }}
        run: |
          if [ "$LOOP_ENABLED" != "true" ]; then
            echo "::notice::LOOP_ENABLED is not 'true'; this T0 worker does nothing."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bad=0
          check() { # name value pattern
            # [[ =~ ]] matches the whole string, so a value with a newline is refused (grep matched line by line).
            if ! [[ "$2" =~ $3 ]]; then echo "::error::input $1 is empty or has a character outside its allowed set"; bad=1; fi
          }
          check shard_id "$IN_SHARD_ID" '^[A-Za-z0-9._-]{1,64}$'
          check attempt_id "$IN_ATTEMPT_ID" '^[A-Za-z0-9._-]{1,64}$'
          check fence "$IN_FENCE" '^[A-Za-z0-9._:-]{1,64}$'
          check run_key "$IN_RUN_KEY" '^[A-Za-z0-9._:-]{1,64}$'
          [ "$bad" -eq 0 ] || exit 1
          {
            echo "go=true"
            echo "attempt_id=$IN_ATTEMPT_ID"
            echo "fence=$IN_FENCE"
            echo "run_key=$IN_RUN_KEY"
          } >> "$GITHUB_OUTPUT"

  research:
    needs: t0-start
    permissions:
      contents: read
    if: needs.t0-start.outputs.go == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAN_HASH: eb631d09a2fc072f
      MWSV_KMS_BIN: ${{ github.workspace }}/exp/harness/build/out/research/kubernetes-mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CLI first, before any server or third-party code runs in this job (public repository, no token).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Check out the experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/kubernetes-mcp-writepath-experiment
          ref: ${{ env.EXP_REF }}
          path: exp
          fetch-depth: 0          # build.sh reads the trees of the tags upstream-v0.1.2 and research-v0.1.2
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the research server
        env:
          GOTOOLCHAIN: local
        run: exp/harness/build/build.sh research
      - name: Install kind
        env:
          GOTOOLCHAIN: local
        run: |
          go install "sigs.k8s.io/kind@$KIND_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Create the cluster
        run: dogfood/kubernetes/up.sh exp
      - name: Fixtures
        run: dogfood/kubernetes/seed.sh
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: dogfood/kubernetes/writecheck.yaml
          mode: plan
          artifact-name: kubernetes-research-plan
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" research
      - name: Catalog
        uses: ./
        with:
          manifest: dogfood/kubernetes/writecheck.yaml
          mode: catalog
          fail-on: must
          artifact-name: kubernetes-research-catalog
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Full run
        uses: ./
        with:
          manifest: dogfood/kubernetes/writecheck.yaml
          mode: full
          fail-on: must
          confirm-target: mwsv-kind
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: kubernetes-research-full
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Objects of the run still in the cluster
        if: always()
        run: |
          [ -x "${MWSV_KUBECTL:-}" ] || exit 0
          KUBECONFIG="$ADMIN_KUBECONFIG" "$MWSV_KUBECTL" get ns,cm,pod,svc,vm,vmclone -A --no-headers \
            -o custom-columns=K:.kind,NS:.metadata.namespace,N:.metadata.name,DT:.metadata.deletionTimestamp | grep 'mwsc-' || echo "none"

  # Upstream v0.1.2 from npm with the vendor manifest. Needs the owner's go before it is enabled: job logs and summaries
  # of this repository are public. PLAN_HASH must be read and pinned on the first enabled run.
  vendor:
    needs: t0-start
    permissions:
      contents: read
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAN_HASH: '0000000000000000'
      MWSV_KMS_BIN: ${{ github.workspace }}/vendor/node_modules/kubernetes-mcp-server-linux-amd64/bin/kubernetes-mcp-server-linux-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CLI first, before any server or third-party code runs in this job (public repository, no token).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Check out the experiment (cluster RBAC)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/kubernetes-mcp-writepath-experiment
          ref: ${{ env.EXP_REF }}
          path: exp
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the upstream server
        # From the committed lockfile (dogfood/kubernetes/vendor-npm): every package pinned by version and integrity.
        run: cp -R dogfood/kubernetes/vendor-npm vendor && cd vendor && npm ci --ignore-scripts --no-audit --no-fund
      - name: Install kind
        env:
          GOTOOLCHAIN: local
        run: |
          go install "sigs.k8s.io/kind@$KIND_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Create the cluster
        run: dogfood/kubernetes/up.sh exp
      - name: Fixtures
        run: dogfood/kubernetes/seed.sh
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: dogfood/kubernetes/vendor.yaml
          mode: plan
          artifact-name: kubernetes-vendor-plan
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" vendor
      - name: Full run
        uses: ./
        with:
          manifest: dogfood/kubernetes/vendor.yaml
          mode: full
          fail-on: must
          confirm-target: mwsv-kind
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: kubernetes-vendor-full
          cli-path: ${{ env.MWSC_CLI_PATH }}

  t0-manifest:
    needs: [t0-start, research, vendor]
    if: ${{ always() && needs.t0-start.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Runs none of the workflow's code: it only reads the jobs' results (and, for a failed run, which steps failed) and builds the sealed bundle.
    permissions:
      contents: read
      actions: read # the failed steps of this run, to tell infrastructure from our tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the result bundle
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          node loop/t0-bundle.mjs --out "$RUNNER_TEMP/out"
      - uses: isokron-ai/tool-qa/worker-kit@b04b7c65c244de48c32f93c7ea9b9ac933ca1efe # tool-qa main, 27 Nov 2026 (T0_WORKER_KIT_REF)
        with:
          bundle-dir: ${{ runner.temp }}/out/bundle
          meta-file: ${{ runner.temp }}/out/meta.json
          attempt-id: ${{ needs.t0-start.outputs.attempt_id }}
          item-index: 0
          fence: ${{ needs.t0-start.outputs.fence }}
          run-key: ${{ needs.t0-start.outputs.run_key }}
