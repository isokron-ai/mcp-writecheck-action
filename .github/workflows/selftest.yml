# T0 worker: dispatch only (no schedule, push or pull_request). Comments below that say nightly or automatic
# describe the earlier setup; see the README section "T0 workers".
#
# The action's script against tiny-tracker, the MWS sample server, as test/local-test.sh runs it:
# every mode, a lost bystander, a stopped, a cancelled and a crashed run, and the unit tests with
# the built CLI and the spec. Needs no secret: isokron-ai/mcp-write-safety is public.
#
# Not run on pull_request (it takes a while); dispatch it on a pull request's branch instead.

name: selftest

run-name: shard ${{ inputs.shard_id }}

on:
  # Dispatch only: a T0 worker. There is no schedule, push or pull_request trigger.
  workflow_dispatch:
    inputs:
      shard_id:
        description: T0 shard id (letters, digits, dot, underscore, hyphen; at most 64).
        required: true
        type: string
      attempt_id:
        description: Attempt id (same character set). Names the manifest artifact t0-<attempt_id>.
        required: true
        type: string
      fence:
        description: Fence token (letters, digits, dot, colon, underscore, hyphen; at most 64).
        required: true
        type: string
      run_key:
        description: Run key (same character set as fence).
        required: true
        type: string

permissions: {}

concurrency:
  group: selftest-${{ inputs.shard_id }}-${{ inputs.attempt_id }}
  cancel-in-progress: false

env:
  # The commits the action is tested against: the CLI (contract.mjs CLI_DEFAULT_REF), tiny-tracker
  # and the spec, all in the public isokron-ai/mcp-write-safety (MWS 0.9). The CLI is at 3af41c6 (stop_sent);
  # tiny-tracker and the spec are unchanged since 7b95215.
  CLI_REF: 3af41c6fb79d66afdea41ebcabc6f7fc18e77c6a
  TINY_TRACKER_REF: 7b952151dddd84260d057cdb506081820003fe56
  SPEC_REF: 7b952151dddd84260d057cdb506081820003fe56

jobs:
  t0-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      go: ${{ steps.guard.outputs.go }}
      attempt_id: ${{ steps.guard.outputs.attempt_id }}
      fence: ${{ steps.guard.outputs.fence }}
      run_key: ${{ steps.guard.outputs.run_key }}
    steps:
      - id: guard
        name: Kill switch, then validate the inputs
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          IN_SHARD_ID: ${{ inputs.shard_id }}
          IN_ATTEMPT_ID: ${{ inputs.attempt_id }}
          IN_FENCE: ${{ inputs.fence }}
          IN_RUN_KEY: ${{ inputs.run_key }}
        run: |
          if [ "$LOOP_ENABLED" != "true" ]; then
            echo "::notice::LOOP_ENABLED is not 'true'; this T0 worker does nothing."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bad=0
          check() { # name value pattern
            if ! printf '%s' "$2" | grep -Eq "$3"; then echo "::error::input $1 is empty or has a character outside its allowed set"; bad=1; fi
          }
          check shard_id "$IN_SHARD_ID" '^[A-Za-z0-9._-]{1,64}$'
          check attempt_id "$IN_ATTEMPT_ID" '^[A-Za-z0-9._-]{1,64}$'
          check fence "$IN_FENCE" '^[A-Za-z0-9._:-]{1,64}$'
          check run_key "$IN_RUN_KEY" '^[A-Za-z0-9._:-]{1,64}$'
          [ "$bad" -eq 0 ] || exit 1
          {
            echo "go=true"
            echo "attempt_id=$IN_ATTEMPT_ID"
            echo "fence=$IN_FENCE"
            echo "run_key=$IN_RUN_KEY"
          } >> "$GITHUB_OUTPUT"

  selftest:
    needs: t0-start
    if: needs.t0-start.outputs.go == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: action
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: The pinned CLI commit is the action's default
        working-directory: action
        run: |
          node --input-type=module -e "
            import { CLI_DEFAULT_REF } from './contract.mjs';
            if (CLI_DEFAULT_REF !== process.env.CLI_REF) { console.error('contract.mjs CLI_DEFAULT_REF ' + CLI_DEFAULT_REF + ' is not CLI_REF ' + process.env.CLI_REF); process.exit(1); }
          "

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ env.CLI_REF }}
          path: mws
          fetch-depth: 0
          persist-credentials: false

      - name: Build the CLI, tiny-tracker and the spec at the pinned commits
        run: |
          set -euo pipefail
          test "$(git -C mws rev-parse HEAD)" = "$CLI_REF"
          (cd mws/packages/writecheck && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          mkdir -p tt spec
          git -C mws archive "$TINY_TRACKER_REF" examples/tiny-tracker | tar -x -C tt
          (cd tt/examples/tiny-tracker && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          git -C mws show "$SPEC_REF:spec/mws.md" > spec/mws.md

      - name: Local test against tiny-tracker
        run: |
          set -o pipefail
          # tiny-tracker's backend token for this job only, masked before anything can print it.
          TRACKER_BACKEND_TOKEN="local-test-$(openssl rand -hex 16)"
          echo "::add-mask::$TRACKER_BACKEND_TOKEN"
          export TRACKER_BACKEND_TOKEN
          status=0
          MWS_REPO="$PWD/mws" \
          CLI_DIR="$PWD/mws/packages/writecheck" \
          TINY_TRACKER_DIR="$PWD/tt/examples/tiny-tracker" \
          MWS_SPEC="$PWD/spec/mws.md" \
            action/test/local-test.sh "$RUNNER_TEMP/local-test" 2>&1 | tee "$RUNNER_TEMP/local-test.txt" || status=$?
          {
            echo "## Self-test against tiny-tracker"
            echo
            echo "CLI $CLI_REF, tiny-tracker $TINY_TRACKER_REF, spec $SPEC_REF. Exit status $status."
            echo
            echo '````text'
            cut -c1-240 "$RUNNER_TEMP/local-test.txt"
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  t0-manifest:
    needs: [t0-start, selftest]
    if: ${{ always() && needs.t0-start.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write the manifest stub
        env:
          ATTEMPT_ID: ${{ needs.t0-start.outputs.attempt_id }}
          FENCE: ${{ needs.t0-start.outputs.fence }}
          RUN_KEY: ${{ needs.t0-start.outputs.run_key }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          conclusion=success
          for r in $RESULTS; do
            case "$r" in failure) conclusion=failure ;; cancelled) [ "$conclusion" = failure ] || conclusion=cancelled ;; esac
          done
          CONCLUSION="$conclusion" node -e 'require("fs").writeFileSync("t0-manifest.json", JSON.stringify({ attempt_id: process.env.ATTEMPT_ID, fence: process.env.FENCE, run_key: process.env.RUN_KEY, conclusion: process.env.CONCLUSION }, null, 2) + "\n")'
          cat t0-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t0-${{ needs.t0-start.outputs.attempt_id }}
          path: t0-manifest.json
          if-no-files-found: error
          retention-days: 3
