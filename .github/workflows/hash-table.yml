# Builds the plan hash table (hash-table.json and hash-table.md) from finished dogfood runs: old = the hash pinned
# in the repository files, new = the hash CI computed (the plan-hash-row notices of dogfood/check-plan-hash.sh).
# Dispatch with the run ids. Reads only; accepts nothing; no secret.
#
# Before this file is on the default branch a dispatch cannot find it: on a pull request it runs when
# dogfood/hash-table-runs.txt changes (one line of run ids), so a push of that file asks for a table.
name: hash-table
run-name: hash table ${{ inputs.run_ids || 'from dogfood/hash-table-runs.txt' }}
on:
  pull_request:
    paths:
      - dogfood/hash-table-runs.txt
      - dogfood/hash-table.mjs
      - .github/workflows/hash-table.yml
  workflow_dispatch:
    inputs:
      run_ids:
        description: Space-separated ids of finished runs of the dogfood workflows.
        required: true
        type: string
permissions: {}
jobs:
  table:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build the table
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.run_ids }}
        run: |
          [ -n "$RUN_IDS" ] || RUN_IDS=$(grep -v '^#' dogfood/hash-table-runs.txt | tr -s ' \n' ' ' | sed 's/^ //;s/ $//')
          [[ "$RUN_IDS" =~ ^[0-9]+( [0-9]+)*$ ]] || { echo "::error::run_ids must be space-separated numbers"; exit 1; }
          # shellcheck disable=SC2086
          node dogfood/hash-table.mjs "$RUNNER_TEMP/hash-table" $RUN_IDS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hash-table
          path: ${{ runner.temp }}/hash-table/
