# T0 worker: dispatch only (no schedule, push or pull_request). Comments below that say nightly or automatic
# describe the earlier setup; see the README section "T0 workers".
#
# Dogfood: this action against kronicle-lite (isokron-ai/kronicle-lite), every night and on demand.
#
# kronicle-lite is a local stdio server over one SQLite file. The job builds it at a pinned commit,
# makes a fresh data directory for this job only (dogfood/kronicle-lite/setup.sh seeds a guard
# document and two bystander documents there), and runs plan, catalog and a full run with
# fail-on: must. Every object the run creates lives in that directory and goes with the runner.
#
# The plan hash below was read and accepted by a person (the action's rule: never take a hash from
# a plan job's output). When kronicle-lite, the manifest or the CLI pin changes, the full run is
# refused with a hash mismatch: read the new plan in the plan step's summary and update the hash.
#
# A dispatch with `candidate-manifest` runs the candidate manifest instead: writecheck.yaml plus
# document-reput, a put_document resource with a caller-chosen key, built by
# dogfood/kronicle-lite/candidate-manifest.sh, with its own known violations
# (known-violations-candidate.txt). The key makes the run re-put an existing slug, the call MWS-ANN-2
# and MWS-ANN-5 judge put_document by. The pinned CLI (f573a24) reads the key's `class` field, so it no
# longer needs `cli-ref`. A dispatch with `kronicle-lite-ref` builds another kronicle-lite commit (its
# plans differ: pass their hashes in `plan-hashes`). Scheduled, pull-request and push runs are unchanged.
#
# Security: no pull_request_target. A pull request from a fork runs nothing here (each job's `if:`).
# No secret is used: isokron-ai/mcp-write-safety is public, so the "Check out mcp-writecheck" step
# needs no token; the action gets the built CLI through cli-path. Third-party actions are pinned by full SHA.
# kronicle-lite is public and checked out without a token.

name: "dogfood: kronicle-lite"

run-name: shard ${{ inputs.shard_id }}

on:
  # Dispatch only: a T0 worker. There is no schedule, push or pull_request trigger.
  workflow_dispatch:
    inputs:
      shard_id:
        description: T0 shard id (letters, digits, dot, underscore, hyphen; at most 64).
        required: true
        type: string
      attempt_id:
        description: Attempt id (same character set). Names the manifest artifact t0-<attempt_id>.
        required: true
        type: string
      fence:
        description: Fence token (letters, digits, dot, colon, underscore, hyphen; at most 64).
        required: true
        type: string
      run_key:
        description: Run key (same character set as fence).
        required: true
        type: string
      cli-ref:
        description: mcp-writecheck commit to test with (full 40-character SHA). Empty for the action's default.
        required: false
        default: ''
      candidate-manifest:
        description: Run the candidate manifest (writecheck.yaml plus a put_document resource with a re-put key) and its known violations.
        type: boolean
        required: false
        default: false
      kronicle-lite-ref:
        description: kronicle-lite commit of isokron-ai/kronicle-lite to build (full SHA). Empty for the pinned one.
        required: false
        default: ''
      plan-hashes:
        description: "Accepted plan hashes for that CLI, after reading the plans: space-separated job=hash pairs (job names as in this file)."
        required: false
        default: ''

permissions: {}

concurrency:
  group: dogfood-kronicle-lite-${{ github.ref }}-${{ inputs.shard_id }}-${{ inputs.attempt_id }}
  cancel-in-progress: false

env:
  PLAN_HASHES: ${{ inputs.plan-hashes }}
  # isokron-ai/kronicle-lite 0.11.2 (14 Nov 2026), or the dispatch input kronicle-lite-ref.
  KL_REF: ${{ inputs.kronicle-lite-ref || '3bac5a73266c668fe77ed831924cded90e18a7b0' }}
  # dogfood/kronicle-lite/candidate-manifest.sh replaces both on a candidate-manifest dispatch.
  KL_MANIFEST: dogfood/kronicle-lite/writecheck.yaml
  KL_KNOWN: dogfood/kronicle-lite/known-violations.txt

jobs:
  t0-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      go: ${{ steps.guard.outputs.go }}
      attempt_id: ${{ steps.guard.outputs.attempt_id }}
      fence: ${{ steps.guard.outputs.fence }}
      run_key: ${{ steps.guard.outputs.run_key }}
    steps:
      - id: guard
        name: Kill switch, then validate the inputs
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          IN_SHARD_ID: ${{ inputs.shard_id }}
          IN_ATTEMPT_ID: ${{ inputs.attempt_id }}
          IN_FENCE: ${{ inputs.fence }}
          IN_RUN_KEY: ${{ inputs.run_key }}
        run: |
          if [ "$LOOP_ENABLED" != "true" ]; then
            echo "::notice::LOOP_ENABLED is not 'true'; this T0 worker does nothing."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bad=0
          check() { # name value pattern
            if ! printf '%s' "$2" | grep -Eq "$3"; then echo "::error::input $1 is empty or has a character outside its allowed set"; bad=1; fi
          }
          check shard_id "$IN_SHARD_ID" '^[A-Za-z0-9._-]{1,64}$'
          check attempt_id "$IN_ATTEMPT_ID" '^[A-Za-z0-9._-]{1,64}$'
          check fence "$IN_FENCE" '^[A-Za-z0-9._:-]{1,64}$'
          check run_key "$IN_RUN_KEY" '^[A-Za-z0-9._:-]{1,64}$'
          [ "$bad" -eq 0 ] || exit 1
          {
            echo "go=true"
            echo "attempt_id=$IN_ATTEMPT_ID"
            echo "fence=$IN_FENCE"
            echo "run_key=$IN_RUN_KEY"
          } >> "$GITHUB_OUTPUT"

  own:
    needs: t0-start
    permissions:
      contents: read
    if: needs.t0-start.outputs.go == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAN_HASH: ddf41337c24a60ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CLI first, before any server or third-party code runs in this job (public repository, no token).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: The kronicle-lite ref is a full commit SHA
        env:
          NAME: kronicle-lite-ref
          REF: ${{ env.KL_REF }}
        run: dogfood/check-ref.sh
      - name: Use the candidate manifest
        if: inputs.candidate-manifest
        run: dogfood/kronicle-lite/candidate-manifest.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Check out kronicle-lite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/kronicle-lite
          ref: ${{ env.KL_REF }}
          path: kl
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Install scripts run: better-sqlite3 installs its prebuilt native module that way.
      - name: The kronicle-lite commit is on its main (kronicle-lite-ref)
        run: dogfood/kronicle-lite/check-on-main.sh
      - name: Build kronicle-lite
        working-directory: kl
        run: npm ci --no-audit --no-fund && npm run build
      - name: A fresh data directory, seeded
        run: dogfood/kronicle-lite/setup.sh
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: ${{ env.KL_MANIFEST }}
          mode: plan
          artifact-name: kronicle-lite-plan
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" own
      - name: Catalog
        uses: ./
        with:
          manifest: ${{ env.KL_MANIFEST }}
          mode: catalog
          fail-on: must
          artifact-name: kronicle-lite-catalog
          cli-path: ${{ env.MWSC_CLI_PATH }}
      # fail-on: none, and the next step compares the violated MUST records with the known ones; the
      # action still fails the step on its own safety rules (lost bystanders, unfinished clean-up, a
      # run that did not complete).
      - id: full
        name: Full run
        uses: ./
        with:
          manifest: ${{ env.KL_MANIFEST }}
          mode: full
          fail-on: none
          confirm-target: kronicle-lite-dogfood
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: kronicle-lite-full
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Violated MUST records against the known ones
        if: always() && steps.full.outputs.results-path != ''
        env:
          RESULTS: ${{ steps.full.outputs.results-path }}
        run: node dogfood/expect-violations.mjs "$KL_KNOWN" "$RESULTS"

  t0-manifest:
    needs: [t0-start, own]
    if: ${{ always() && needs.t0-start.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write the manifest stub
        env:
          ATTEMPT_ID: ${{ needs.t0-start.outputs.attempt_id }}
          FENCE: ${{ needs.t0-start.outputs.fence }}
          RUN_KEY: ${{ needs.t0-start.outputs.run_key }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          conclusion=success
          for r in $RESULTS; do
            case "$r" in failure) conclusion=failure ;; cancelled) [ "$conclusion" = failure ] || conclusion=cancelled ;; esac
          done
          CONCLUSION="$conclusion" node -e 'require("fs").writeFileSync("t0-manifest.json", JSON.stringify({ attempt_id: process.env.ATTEMPT_ID, fence: process.env.FENCE, run_key: process.env.RUN_KEY, conclusion: process.env.CONCLUSION }, null, 2) + "\n")'
          cat t0-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t0-${{ needs.t0-start.outputs.attempt_id }}
          path: t0-manifest.json
          if-no-files-found: error
          retention-days: 3
