# T0 worker: dispatch only (no schedule, push or pull_request). Comments below that say nightly or automatic
# describe the earlier setup; see the README section "T0 workers".
#
# Dogfood: this action against IsoKron's research build of the Payload MCP plugin, every night and
# on demand.
#
#   research  isokron-ai/payload-mcp-writepath-experiment at a pinned commit: the sandbox Payload
#             3.93.0 app (harness/app) with the research build v2.1 of @payloadcms/plugin-mcp
#             swapped in by the experiment's own build script, on Postgres in a container started by a step.
#             plan, catalog, then a full run. The full run uses fail-on: none, and the job compares
#             its violated records with dogfood/payload/expected-violations.research.txt: a new
#             violated record, or a known one that no longer appears, fails the job. A run that does
#             not complete, loses a bystander or cannot finish its clean-up fails it whatever
#             fail-on says, and an independent REST snapshot before and after checks the documents
#             the tester did not create.
#   research-shim  the same through dogfood/payload/shim.mjs, which copies the JSON the plugin's
#             answers already carry in their text into structuredContent, so that lists can be read
#             (bystander inventory, clean-up sweep, MWS-RES-3), and adds a read-only guard tool.
#   vendor    the same app with @payloadcms/plugin-mcp 3.93.0 as published upstream. DISABLED: it
#             needs the owner's go. The logs and summaries of this repository are public.
#
# The plan hash was read and accepted by a person (never taken from a plan step's output). When the
# experiment commit, the manifest or the CLI pin changes, the hash check fails: read the new plan in
# the plan step's summary and update PLAN_HASH.
#
# Security: no pull_request_target. A pull request from a fork runs nothing here (each job's `if:`).
# No secret is used: isokron-ai/mcp-write-safety is public, so the "Check out mcp-writecheck" step
# needs no token. Every
# credential of the app and of Postgres is generated in the job and masked. Third-party actions are pinned by full SHA.

name: "dogfood: payload"

run-name: shard ${{ inputs.shard_id }}

on:
  # Dispatch only: a T0 worker. There is no schedule, push or pull_request trigger.
  workflow_dispatch:
    inputs:
      shard_id:
        description: T0 shard id (letters, digits, dot, underscore, hyphen; at most 64).
        required: true
        type: string
      attempt_id:
        description: Attempt id (same character set). Names the result artifact result-<attempt_id>-0.tar.age.
        required: true
        type: string
      fence:
        description: Fence token (letters, digits, dot, colon, underscore, hyphen; at most 64).
        required: true
        type: string
      run_key:
        description: Run key (same character set as fence).
        required: true
        type: string
      cli-ref:
        description: mcp-writecheck commit to test with (full 40-character SHA). Empty for the action's default.
        required: false
        default: ''
      plan-hashes:
        description: "Accepted plan hashes for that CLI, after reading the plans: space-separated job=hash pairs (job names as in this file)."
        required: false
        default: ''

permissions: {}

concurrency:
  group: dogfood-payload-${{ github.ref }}-${{ inputs.shard_id }}-${{ inputs.attempt_id }}
  cancel-in-progress: false

env:
  PLAN_HASHES: ${{ inputs.plan-hashes }}
  # isokron-ai/payload-mcp-writepath-experiment main (its packages/plugin-mcp is research v2.1;
  # the build script builds from the tags research-v2.1-v3.93.0 and upstream-v3.93.0).
  EXP_REF: 35415109e36c45b6b0e9d9eb7686218a3b320e01
  PAYLOAD_URL: http://127.0.0.1:4960

jobs:
  t0-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      go: ${{ steps.guard.outputs.go }}
      attempt_id: ${{ steps.guard.outputs.attempt_id }}
      fence: ${{ steps.guard.outputs.fence }}
      run_key: ${{ steps.guard.outputs.run_key }}
    steps:
      - id: guard
        name: Kill switch, then validate the inputs
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          IN_SHARD_ID: ${{ inputs.shard_id }}
          IN_ATTEMPT_ID: ${{ inputs.attempt_id }}
          IN_FENCE: ${{ inputs.fence }}
          IN_RUN_KEY: ${{ inputs.run_key }}
        run: |
          if [ "$LOOP_ENABLED" != "true" ]; then
            echo "::notice::LOOP_ENABLED is not 'true'; this T0 worker does nothing."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bad=0
          check() { # name value pattern
            # [[ =~ ]] matches the whole string, so a value with a newline is refused (grep matched line by line).
            if ! [[ "$2" =~ $3 ]]; then echo "::error::input $1 is empty or has a character outside its allowed set"; bad=1; fi
          }
          check shard_id "$IN_SHARD_ID" '^[A-Za-z0-9._-]{1,64}$'
          check attempt_id "$IN_ATTEMPT_ID" '^[A-Za-z0-9._-]{1,64}$'
          check fence "$IN_FENCE" '^[A-Za-z0-9._:-]{1,64}$'
          check run_key "$IN_RUN_KEY" '^[A-Za-z0-9._:-]{1,64}$'
          [ "$bad" -eq 0 ] || exit 1
          {
            echo "go=true"
            echo "attempt_id=$IN_ATTEMPT_ID"
            echo "fence=$IN_FENCE"
            echo "run_key=$IN_RUN_KEY"
          } >> "$GITHUB_OUTPUT"

  research:
    needs: t0-start
    permissions:
      contents: read
    if: needs.t0-start.outputs.go == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAN_HASH: 51bc52f039e475ee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CLI first, before any server or third-party code runs in this job (public repository, no token).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Check out the experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/payload-mcp-writepath-experiment
          ref: ${{ env.EXP_REF }}
          path: exp
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install pnpm
        run: dogfood/install-pnpm.sh
      - name: Build the research app
        run: dogfood/payload/stack.sh build research
      - name: Start Postgres (password made here, masked)
        run: dogfood/payload/stack.sh pg
      - name: Start the app
        run: dogfood/payload/stack.sh start research
      - name: Seed users, the MCP key, the fixed rows and the bystanders
        run: node dogfood/payload/setup.mjs
      - name: Snapshot the documents the tester does not create
        run: node dogfood/payload/snap.mjs > "$RUNNER_TEMP/snap-before.json"
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: dogfood/payload/writecheck.research.yaml
          mode: plan
          artifact-name: payload-research-plan
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" research
      - name: Catalog
        uses: ./
        with:
          manifest: dogfood/payload/writecheck.research.yaml
          mode: catalog
          fail-on: any
          artifact-name: payload-research-catalog
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - id: full
        name: Full run
        uses: ./
        with:
          manifest: dogfood/payload/writecheck.research.yaml
          mode: full
          fail-on: none
          confirm-target: dogfood-payload-research-v2.1
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: payload-research-full
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Compare the violated records with the known ones
        if: always() && steps.full.outputs.results-path != ''
        env:
          RESULTS: ${{ steps.full.outputs.results-path }}
        run: node dogfood/payload/expect.mjs "$RESULTS/results.json" dogfood/payload/expected-violations.research.txt
      - name: Check the documents the tester does not create
        if: always() && steps.full.outcome != 'skipped'
        run: node dogfood/payload/snap.mjs --compare "$RUNNER_TEMP/snap-before.json"
      - name: Stop the app
        if: always()
        run: dogfood/payload/stack.sh stop

  research-shim:
    needs: t0-start
    permissions:
      contents: read
    if: needs.t0-start.outputs.go == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAN_HASH: 1b8d0329639626e9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CLI first, before any server or third-party code runs in this job (public repository, no token).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Check out the experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/payload-mcp-writepath-experiment
          ref: ${{ env.EXP_REF }}
          path: exp
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install pnpm
        run: dogfood/install-pnpm.sh
      - name: Build the research app
        run: dogfood/payload/stack.sh build research
      - name: Start Postgres (password made here, masked)
        run: dogfood/payload/stack.sh pg
      - name: Start the app
        run: dogfood/payload/stack.sh start research
      - name: Start the shim
        run: dogfood/payload/stack.sh shim
      - name: Seed users, the MCP key, the fixed rows and the bystanders
        run: node dogfood/payload/setup.mjs
      - name: Snapshot the documents the tester does not create
        run: node dogfood/payload/snap.mjs > "$RUNNER_TEMP/snap-before.json"
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: dogfood/payload/writecheck.research-shim.yaml
          mode: plan
          artifact-name: payload-research-shim-plan
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" research-shim
      - name: Catalog
        uses: ./
        with:
          manifest: dogfood/payload/writecheck.research-shim.yaml
          mode: catalog
          fail-on: any
          artifact-name: payload-research-shim-catalog
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - id: full
        name: Full run
        uses: ./
        with:
          manifest: dogfood/payload/writecheck.research-shim.yaml
          mode: full
          fail-on: none
          confirm-target: dogfood-payload-research-v2.1-shim
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: payload-research-shim-full
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Compare the violated records with the known ones
        if: always() && steps.full.outputs.results-path != ''
        env:
          RESULTS: ${{ steps.full.outputs.results-path }}
        run: node dogfood/payload/expect.mjs "$RESULTS/results.json" dogfood/payload/expected-violations.research-shim.txt
      - name: Check the documents the tester does not create
        if: always() && steps.full.outcome != 'skipped'
        run: node dogfood/payload/snap.mjs --compare "$RUNNER_TEMP/snap-before.json"
      - name: Stop the app and the shim
        if: always()
        run: dogfood/payload/stack.sh stop

  vendor:
    needs: t0-start
    permissions:
      contents: read
    # DISABLED: needs the owner's go. This repository's logs and job summaries are public, and the
    # upstream build's results would publish findings that have not all been reported upstream.
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Not accepted yet: read the vendor plan before pinning its hash.
      PLAN_HASH: 'none'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CLI first, before any server or third-party code runs in this job (public repository, no token).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Check out the experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/payload-mcp-writepath-experiment
          ref: ${{ env.EXP_REF }}
          path: exp
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install pnpm
        run: dogfood/install-pnpm.sh
      - name: Install the app (upstream plugin, unmodified)
        run: dogfood/payload/stack.sh build vendor
      - name: Start Postgres (password made here, masked)
        run: dogfood/payload/stack.sh pg
      - name: Start the app
        run: dogfood/payload/stack.sh start vendor
      - name: Seed users, the MCP key, the fixed rows and the bystanders
        run: node dogfood/payload/setup.mjs
      - name: Snapshot the documents the tester does not create
        run: node dogfood/payload/snap.mjs > "$RUNNER_TEMP/snap-before.json"
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: dogfood/payload/writecheck.vendor.yaml
          mode: plan
          artifact-name: payload-vendor-plan
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" vendor
      - id: full
        name: Full run
        uses: ./
        with:
          manifest: dogfood/payload/writecheck.vendor.yaml
          mode: full
          fail-on: none
          confirm-target: dogfood-payload-vendor-3.93.0
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: payload-vendor-full
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Check the documents the tester does not create
        if: always() && steps.full.outcome != 'skipped'
        run: node dogfood/payload/snap.mjs --compare "$RUNNER_TEMP/snap-before.json"
      - name: Stop the app
        if: always()
        run: dogfood/payload/stack.sh stop

  t0-manifest:
    needs: [t0-start, research, research-shim, vendor]
    if: ${{ always() && needs.t0-start.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Runs none of the workflow's code: it only reads the jobs' results (and, for a failed run, which steps failed) and builds the sealed bundle.
    permissions:
      contents: read
      actions: read # the failed steps of this run, to tell infrastructure from our tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the result bundle
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          node loop/t0-bundle.mjs --out "$RUNNER_TEMP/out"
      - uses: isokron-ai/tool-qa/worker-kit@b04b7c65c244de48c32f93c7ea9b9ac933ca1efe # tool-qa main, 27 Nov 2026 (T0_WORKER_KIT_REF)
        with:
          bundle-dir: ${{ runner.temp }}/out/bundle
          meta-file: ${{ runner.temp }}/out/meta.json
          attempt-id: ${{ needs.t0-start.outputs.attempt_id }}
          item-index: 0
          fence: ${{ needs.t0-start.outputs.fence }}
          run-key: ${{ needs.t0-start.outputs.run_key }}
