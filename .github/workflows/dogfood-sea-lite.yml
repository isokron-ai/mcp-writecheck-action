# Dogfood: this action against sea-lite (isokron-ai/sea-lite), every night and on demand.
#
#   sea-lite        plan, catalog and a full run of dogfood/sea-lite/writecheck.yaml, fail-on: must.
#                   Expected green.
#   cli-known-bugs  a cut-down manifest (writecheck-claim.yaml) on which the CLI at the pinned commit
#                   gives known false `violated` results. The job passes only while exactly those
#                   are present; it fails once the CLI is fixed, so the fix is noticed.
#
# sea-lite runs over stdio from the checked-out repository, with a store made for this job only in
# the runner's temp folder (SEA_LITE_DATA_DIR); every ticket in it is disposable.
#
# The plan hashes below were read and accepted by a person (never taken from a plan step's output).
# When sea-lite, a manifest or the CLI pin changes, the full run is refused at the hash check: read
# the new plan in the plan step's summary, then update the hash.
#
# Security: no pull_request_target. A pull request from a fork runs nothing here (each job's `if:`), so
# a fork never gets MWS_CLI_TOKEN (read-only on isokron-ai/mcp-write-safety), which only the
# "Check out mcp-writecheck" step uses, before any server code is installed or started; the action
# gets the built CLI through cli-path. Third-party actions are pinned by full SHA.
# sea-lite is public and checked out without a token.

name: "dogfood: sea-lite"

on:
  workflow_dispatch:
    inputs:
      cli-ref:
        description: mcp-writecheck commit to test with (full 40-character SHA). Empty for the action's default.
        required: false
        default: ''
      plan-hashes:
        description: "Accepted plan hashes for that CLI, after reading the plans: space-separated job=hash pairs (job names as in this file)."
        required: false
        default: ''
  schedule:
    - cron: '53 3 * * *'
  pull_request:
    paths: ['dogfood/sea-lite/**', 'dogfood/*.sh', '.github/workflows/dogfood-sea-lite.yml', 'action.yml', 'contract.mjs', 'src/**']
  push:
    branches: [main]
    paths: ['dogfood/sea-lite/**', 'dogfood/*.sh', '.github/workflows/dogfood-sea-lite.yml', 'action.yml', 'contract.mjs', 'src/**']

permissions:
  contents: read

concurrency:
  group: dogfood-sea-lite-${{ github.ref }}
  cancel-in-progress: false

env:
  PLAN_HASHES: ${{ inputs.plan-hashes }}
  # isokron-ai/sea-lite main (0.7.2).
  SEA_LITE_REF: b536cc18d7eeb43a16da3d3bb1f88edfa6df3eb3

jobs:
  sea-lite:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAN_HASH: cfb016f2e5c0983d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CLI first, before any server or third-party code runs in this job: the only step with the token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          token: ${{ secrets.MWS_CLI_TOKEN }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Check out sea-lite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/sea-lite
          ref: ${{ env.SEA_LITE_REF }}
          path: srv
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build sea-lite
        working-directory: srv
        run: npm ci --no-audit --no-fund && npm run build
      - name: Make and seed the job's store
        run: |
          echo "SEA_LITE_DATA_DIR=$RUNNER_TEMP/sea-lite-store" >> "$GITHUB_ENV"
          SEA_LITE_DATA_DIR="$RUNNER_TEMP/sea-lite-store" dogfood/sea-lite/seed.sh
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: dogfood/sea-lite/writecheck.yaml
          mode: plan
          artifact-name: sea-lite-plan
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" sea-lite
      - name: Catalog
        uses: ./
        with:
          manifest: dogfood/sea-lite/writecheck.yaml
          mode: catalog
          fail-on: must
          artifact-name: sea-lite-catalog
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Full run
        uses: ./
        with:
          manifest: dogfood/sea-lite/writecheck.yaml
          mode: full
          fail-on: must
          confirm-target: sea-lite-dogfood
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: sea-lite-full
          cli-path: ${{ env.MWSC_CLI_PATH }}

  cli-known-bugs:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAN_HASH: f386d848003b654c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CLI first, before any server or third-party code runs in this job: the only step with the token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          token: ${{ secrets.MWS_CLI_TOKEN }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Check out sea-lite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/sea-lite
          ref: ${{ env.SEA_LITE_REF }}
          path: srv
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build sea-lite
        working-directory: srv
        run: npm ci --no-audit --no-fund && npm run build
      - name: Make and seed the job's store
        run: |
          echo "SEA_LITE_DATA_DIR=$RUNNER_TEMP/sea-lite-store" >> "$GITHUB_ENV"
          SEA_LITE_DATA_DIR="$RUNNER_TEMP/sea-lite-store" dogfood/sea-lite/seed.sh
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: dogfood/sea-lite/writecheck-claim.yaml
          mode: plan
          artifact-name: sea-lite-known-bugs-plan
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" cli-known-bugs
      - id: full
        name: Full run (known CLI false results expected)
        continue-on-error: true
        uses: ./
        with:
          manifest: dogfood/sea-lite/writecheck-claim.yaml
          mode: full
          fail-on: must
          confirm-target: sea-lite-dogfood
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: sea-lite-known-bugs-full
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Only the known CLI false results may be violated
        env:
          OUTCOME: ${{ steps.full.outcome }}
          EXIT_STATUS: ${{ steps.full.outputs.exit-status }}
          CLI_EXIT: ${{ steps.full.outputs.cli-exit-code }}
          RESULTS: ${{ steps.full.outputs.results-path }}
        run: dogfood/sea-lite/expect-known-cli-bugs.sh
