# T0 worker: dispatch only (no schedule, push or pull_request). Comments below that say nightly or automatic
# describe the earlier setup; see the README section "T0 workers".
#
# Dogfood: this action against sea-lite (isokron-ai/sea-lite), every night and on demand.
#
#   sea-lite        plan, catalog and a full run of dogfood/sea-lite/writecheck.yaml, fail-on: must.
#                   Expected green.
#   cli-fixed-bugs  a cut-down manifest (writecheck-claim.yaml) on which CLI 0295ed6 gave two false
#                   `violated` results (C3 on sea_claim, C4 on sea_create), fixed in f573a24. Full run
#                   with fail-on: any: the job fails if either returns or anything else is violated.
#
# sea-lite runs over stdio from the checked-out repository, with a store made for this job only in
# the runner's temp folder (SEA_LITE_DATA_DIR); every ticket in it is disposable.
#
# The plan hashes below were read and accepted by a person (never taken from a plan step's output).
# When sea-lite, a manifest or the CLI pin changes, the full run is refused at the hash check: read
# the new plan in the plan step's summary, then update the hash.
#
# Security: no pull_request_target. A pull request from a fork runs nothing here (each job's `if:`).
# No secret is used: isokron-ai/mcp-write-safety is public, so the "Check out mcp-writecheck" step
# needs no token; the action gets the built CLI through cli-path. Third-party actions are pinned by full SHA.
# sea-lite is public and checked out without a token.
#
# The sandbox: sea-lite's install and build, the seeding and every run of the server (the CLI starts it) run inside
# isokron-ai/mcp-surface-corpus's sandbox at SANDBOX_REF, the one the writecheck lane (corpus.yml) uses, through
# dogfood/sbx.mjs: gVisor, user 65534, no capability, a read-only root, no runner environment; the install reaches
# registry.npmjs.org only, through the allowlist proxy, and the run has no network out at all. The reusable
# sandbox-conformance job and, on each job's own runner, the sandbox-guard action pass first, both at SANDBOX_REF.
# The sealed bundle is built by t0-manifest, another job that runs none of this code.

name: "dogfood: sea-lite"

run-name: shard ${{ inputs.shard_id }}

on:
  # Dispatch only: a T0 worker. There is no schedule, push or pull_request trigger.
  workflow_dispatch:
    inputs:
      shard_id:
        description: T0 shard id (letters, digits, dot, underscore, hyphen; at most 64).
        required: true
        type: string
      attempt_id:
        description: Attempt id (same character set). Names the result artifact result-<attempt_id>-0.tar.age.
        required: true
        type: string
      fence:
        description: Fence token (letters, digits, dot, colon, underscore, hyphen; at most 64).
        required: true
        type: string
      run_key:
        description: Run key (same character set as fence).
        required: true
        type: string
      cli-ref:
        description: mcp-writecheck commit to test with (full 40-character SHA). Empty for the action's default.
        required: false
        default: ''
      plan-hashes:
        description: "Accepted plan hashes for that CLI, after reading the plans: space-separated job=hash pairs (job names as in this file)."
        required: false
        default: ''

  # The pull-request proof (dogfood-sandbox-proof.yml) calls this same file: proof true builds the bundle in a dry run
  # (no encryption, no upload). The dispatch inputs it does not pass are empty, so the pinned defaults run.
  workflow_call:
    inputs:
      shard_id: { type: string, required: true }
      attempt_id: { type: string, required: true }
      fence: { type: string, required: true }
      run_key: { type: string, required: true }
      proof: { type: boolean, required: false, default: false }
permissions: {}

concurrency:
  group: dogfood-sea-lite-${{ github.ref }}-${{ inputs.shard_id }}-${{ inputs.attempt_id }}
  cancel-in-progress: false

env:
  # isokron-ai/mcp-surface-corpus main at 3738f2c, the commit its nightly conformance tests (as corpus.yml). The
  # conformance job and the sandbox-guard step name this same commit (test/dogfood-sandbox.test.mjs checks).
  SANDBOX_REF: '3738f2c3dabe03e943a1e5ff0a2441aca831e910'
  PLAN_HASHES: ${{ inputs.plan-hashes }}
  # isokron-ai/sea-lite main (0.7.2).
  SEA_LITE_REF: b536cc18d7eeb43a16da3d3bb1f88edfa6df3eb3

jobs:
  t0-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      go: ${{ steps.guard.outputs.go }}
      attempt_id: ${{ steps.guard.outputs.attempt_id }}
      fence: ${{ steps.guard.outputs.fence }}
      run_key: ${{ steps.guard.outputs.run_key }}
    steps:
      - id: guard
        name: Kill switch, then validate the inputs
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          IN_SHARD_ID: ${{ inputs.shard_id }}
          IN_ATTEMPT_ID: ${{ inputs.attempt_id }}
          IN_FENCE: ${{ inputs.fence }}
          IN_RUN_KEY: ${{ inputs.run_key }}
        run: |
          if [ "$LOOP_ENABLED" != "true" ]; then
            echo "::notice::LOOP_ENABLED is not 'true'; this T0 worker does nothing."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bad=0
          check() { # name value pattern
            # [[ =~ ]] matches the whole string, so a value with a newline is refused (grep matched line by line).
            if ! [[ "$2" =~ $3 ]]; then echo "::error::input $1 is empty or has a character outside its allowed set"; bad=1; fi
          }
          check shard_id "$IN_SHARD_ID" '^[A-Za-z0-9._-]{1,64}$'
          check attempt_id "$IN_ATTEMPT_ID" '^[A-Za-z0-9._-]{1,64}$'
          check fence "$IN_FENCE" '^[A-Za-z0-9._:-]{1,64}$'
          check run_key "$IN_RUN_KEY" '^[A-Za-z0-9._:-]{1,64}$'
          [ "$bad" -eq 0 ] || exit 1
          {
            echo "go=true"
            echo "attempt_id=$IN_ATTEMPT_ID"
            echo "fence=$IN_FENCE"
            echo "run_key=$IN_RUN_KEY"
          } >> "$GITHUB_OUTPUT"

  # The sandbox proven on today's runner image before any job that runs third-party code starts.
  conformance:
    needs: t0-start
    if: needs.t0-start.outputs.go == 'true'
    permissions:
      contents: read
    uses: isokron-ai/mcp-surface-corpus/.github/workflows/sandbox-conformance.yml@3738f2c3dabe03e943a1e5ff0a2441aca831e910 # SANDBOX_REF
    with:
      mutations: false
      artifact-prefix: dogfood-sea-lite-conformance

  sea-lite:
    needs: [t0-start, conformance]
    permissions:
      contents: read
    if: needs.t0-start.outputs.go == 'true' && needs.conformance.outputs.verdict == 'pass' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MSC_DIR: msc
      PLAN_HASH: 4b6e3820ae5a5bec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CLI first, before any server or third-party code runs in this job (public repository, no token).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Fetch the sandbox (SANDBOX_REF)
        run: loop/prepare.sh sandbox
      - name: Check out sea-lite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/sea-lite
          ref: ${{ env.SEA_LITE_REF }}
          path: srv
          persist-credentials: false
      # gVisor, the firewall and the hostile self test on this very runner, before any third-party code runs.
      - id: sandbox
        name: Sandbox guard (gVisor, firewall, self test)
        uses: isokron-ai/mcp-surface-corpus/sandbox-guard@3738f2c3dabe03e943a1e5ff0a2441aca831e910 # SANDBOX_REF
      - name: The guard ran the pinned sandbox and passed
        env:
          VERDICT: ${{ steps.sandbox.outputs.verdict }}
          GUARD_SHA: ${{ steps.sandbox.outputs.sandbox-sha }}
        run: dogfood/sandbox-guarded.sh
      - name: Sandbox up (the workspace mirrored into it)
        run: node dogfood/sbx.mjs up
      - name: Build sea-lite (in the sandbox)
        run: node dogfood/sbx.mjs build --image node22-build --hosts registry.npmjs.org --native --cwd srv -- sh -c 'npm ci --no-audit --no-fund && npm run build'
      # SEA_LITE_DATA_DIR goes to the sandbox's own GITHUB_ENV, where the CLI (and serve.sh) read it.
      - name: Make and seed the job's store (in the sandbox)
        run: node dogfood/sbx.mjs exec -- sh -c 'echo "SEA_LITE_DATA_DIR=$RUNNER_TEMP/sea-lite-store" >> "$GITHUB_ENV" && SEA_LITE_DATA_DIR="$RUNNER_TEMP/sea-lite-store" dogfood/sea-lite/seed.sh'
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: dogfood/sea-lite/writecheck.yaml
          mode: plan
          artifact-name: sea-lite-plan
          cli-path: dogfood/sbx-cli
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" sea-lite
      - name: Catalog
        uses: ./
        with:
          manifest: dogfood/sea-lite/writecheck.yaml
          mode: catalog
          fail-on: must
          artifact-name: sea-lite-catalog
          cli-path: dogfood/sbx-cli
      - name: Full run
        uses: ./
        with:
          manifest: dogfood/sea-lite/writecheck.yaml
          mode: full
          fail-on: must
          confirm-target: sea-lite-dogfood
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: sea-lite-full
          cli-path: dogfood/sbx-cli
      - name: End the sandbox
        if: always()
        run: node dogfood/sbx.mjs down
      - name: Stop Docker, and check nothing of the sandbox is left
        if: always()
        run: loop/teardown.sh

  cli-fixed-bugs:
    needs: [t0-start, conformance]
    permissions:
      contents: read
    if: needs.t0-start.outputs.go == 'true' && needs.conformance.outputs.verdict == 'pass' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MSC_DIR: msc
      PLAN_HASH: ff54a66730af2df4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CLI first, before any server or third-party code runs in this job (public repository, no token).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Fetch the sandbox (SANDBOX_REF)
        run: loop/prepare.sh sandbox
      - name: Check out sea-lite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/sea-lite
          ref: ${{ env.SEA_LITE_REF }}
          path: srv
          persist-credentials: false
      # gVisor, the firewall and the hostile self test on this very runner, before any third-party code runs.
      - id: sandbox
        name: Sandbox guard (gVisor, firewall, self test)
        uses: isokron-ai/mcp-surface-corpus/sandbox-guard@3738f2c3dabe03e943a1e5ff0a2441aca831e910 # SANDBOX_REF
      - name: The guard ran the pinned sandbox and passed
        env:
          VERDICT: ${{ steps.sandbox.outputs.verdict }}
          GUARD_SHA: ${{ steps.sandbox.outputs.sandbox-sha }}
        run: dogfood/sandbox-guarded.sh
      - name: Sandbox up (the workspace mirrored into it)
        run: node dogfood/sbx.mjs up
      - name: Build sea-lite (in the sandbox)
        run: node dogfood/sbx.mjs build --image node22-build --hosts registry.npmjs.org --native --cwd srv -- sh -c 'npm ci --no-audit --no-fund && npm run build'
      # SEA_LITE_DATA_DIR goes to the sandbox's own GITHUB_ENV, where the CLI (and serve.sh) read it.
      - name: Make and seed the job's store (in the sandbox)
        run: node dogfood/sbx.mjs exec -- sh -c 'echo "SEA_LITE_DATA_DIR=$RUNNER_TEMP/sea-lite-store" >> "$GITHUB_ENV" && SEA_LITE_DATA_DIR="$RUNNER_TEMP/sea-lite-store" dogfood/sea-lite/seed.sh'
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: dogfood/sea-lite/writecheck-claim.yaml
          mode: plan
          artifact-name: sea-lite-fixed-bugs-plan
          cli-path: dogfood/sbx-cli
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" cli-fixed-bugs
      - id: full
        name: Full run (no violated record expected)
        continue-on-error: true
        uses: ./
        with:
          manifest: dogfood/sea-lite/writecheck-claim.yaml
          mode: full
          fail-on: any
          confirm-target: sea-lite-dogfood
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: sea-lite-fixed-bugs-full
          cli-path: dogfood/sbx-cli
      - name: The former CLI false results stay fixed, and nothing is violated
        env:
          OUTCOME: ${{ steps.full.outcome }}
          EXIT_STATUS: ${{ steps.full.outputs.exit-status }}
          CLI_EXIT: ${{ steps.full.outputs.cli-exit-code }}
          RESULTS: ${{ steps.full.outputs.results-path }}
        run: dogfood/sea-lite/expect-fixed-cli-bugs.sh
      - name: End the sandbox
        if: always()
        run: node dogfood/sbx.mjs down
      - name: Stop Docker, and check nothing of the sandbox is left
        if: always()
        run: loop/teardown.sh

  t0-manifest:
    needs: [t0-start, conformance, sea-lite, cli-fixed-bugs]
    if: ${{ always() && needs.t0-start.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Runs none of the workflow's code: it only reads the jobs' results (and, for a failed run, which steps failed) and builds the sealed bundle.
    permissions:
      contents: read
      actions: read # the failed steps of this run, to tell infrastructure from our tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the result bundle
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          node loop/t0-bundle.mjs --out "$RUNNER_TEMP/out"
      - uses: isokron-ai/tool-qa/worker-kit@b04b7c65c244de48c32f93c7ea9b9ac933ca1efe # tool-qa main, 27 Nov 2026 (T0_WORKER_KIT_REF)
        with:
          bundle-dir: ${{ runner.temp }}/out/bundle
          meta-file: ${{ runner.temp }}/out/meta.json
          attempt-id: ${{ needs.t0-start.outputs.attempt_id }}
          item-index: 0
          fence: ${{ needs.t0-start.outputs.fence }}
          run-key: ${{ needs.t0-start.outputs.run_key }}
          dry-run: ${{ inputs.proof && 'true' || 'false' }}
