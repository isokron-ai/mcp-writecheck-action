# T0 worker: dispatch only (no schedule, push or pull_request). Comments below that say nightly or automatic
# describe the earlier setup; see the README section "T0 workers".
#
# Dogfood: this action against tiny-tracker, the MWS sample server, every night and on demand.
#
#   clean    tiny-tracker as published (no defect switched on): plan, catalog, then a full run with
#            fail-on: must. Expected green.
#   defects  the same server with every teaching defect on (TRACKER_DEFECTS=all). The action must FAIL
#            this job's run step; the job itself passes only when it does, with violated records.
#   defect   a matrix, one tiny-tracker defect per cell (dogfood/tiny-tracker/defects.json): each cell
#            expects a violated record of its defect's requirement (for a review-only clause, a self-attested
#            record answered no), or is a known miss of the CLI
#            (an expected failure, flipped when the CLI detects it). Pinned CLI only: a cli-ref
#            dispatch skips it (its plans would need one accepted hash per cell).
#   traps    two former CLI bugs, now expectations (fixed before CLI 0.1.0): a backend killed during the
#            run, and a run in which every set-up fails (manifest
#            dogfood/tiny-tracker/writecheck-setup-fails.yaml). The CLI must stop each run (exit 4, run
#            status stopped) and the action must fail both full steps; a return of either bug fails the
#            job. A cli-ref dispatch runs them too (plan-hashes keys crash and setup).
#
# The plan hashes below were read and accepted by a person (the action's rule: never take a hash
# from a plan job's output). When tiny-tracker, the manifest or the CLI pin changes, the full run is
# refused with a hash mismatch: read the new plan in the plan step's summary and update the hash.
#
# Security: no pull_request_target. A pull request from a fork runs nothing here (each job's `if:`).
# No secret is used: isokron-ai/mcp-write-safety is public, so the CLI fetch and the tiny-tracker
# checkout need no token. Third-party actions are pinned by full SHA.

name: "dogfood: tiny-tracker"

run-name: shard ${{ inputs.shard_id }}

on:
  # Dispatch only: a T0 worker. There is no schedule, push or pull_request trigger.
  workflow_dispatch:
    inputs:
      shard_id:
        description: T0 shard id (letters, digits, dot, underscore, hyphen; at most 64).
        required: true
        type: string
      attempt_id:
        description: Attempt id (same character set). Names the result artifact result-<attempt_id>-0.tar.age.
        required: true
        type: string
      fence:
        description: Fence token (letters, digits, dot, colon, underscore, hyphen; at most 64).
        required: true
        type: string
      run_key:
        description: Run key (same character set as fence).
        required: true
        type: string
      cli-ref:
        description: mcp-writecheck commit to test with (full 40-character SHA). Empty for the action's default.
        required: false
        default: ''
      tiny-tracker-ref:
        description: tiny-tracker commit of isokron-ai/mcp-write-safety (full SHA). Empty for the pinned one.
        required: false
        default: ''
      manifest-from-cli:
        description: Use the tiny-tracker manifest of the cli-ref commit (needs cli-ref) instead of dogfood/tiny-tracker/writecheck.yaml. The server is still built from tiny-tracker-ref.
        type: boolean
        required: false
        default: false
      plan-hashes:
        description: "Accepted plan hashes for that CLI, after reading the plans: space-separated job=hash pairs (jobs: clean, defects, crash, setup)."
        required: false
        default: ''

permissions: {}

concurrency:
  group: dogfood-tiny-tracker-${{ github.ref }}-${{ inputs.shard_id }}-${{ inputs.attempt_id }}
  cancel-in-progress: false

env:
  # tiny-tracker at 7b95215 of the public isokron-ai/mcp-write-safety (MWS 0.9; the same commit as the CLI pin).
  TT_REF: ${{ inputs.tiny-tracker-ref || '7b952151dddd84260d057cdb506081820003fe56' }}
  PLAN_HASHES: ${{ inputs.plan-hashes }}
  TT_MANIFEST: dogfood/tiny-tracker/writecheck.yaml
  # The same backend URL in every step, so that every step arrives at the same plan hash.
  TRACKER_BACKEND_URL: http://127.0.0.1:4610

jobs:
  t0-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      go: ${{ steps.guard.outputs.go }}
      attempt_id: ${{ steps.guard.outputs.attempt_id }}
      fence: ${{ steps.guard.outputs.fence }}
      run_key: ${{ steps.guard.outputs.run_key }}
    steps:
      - id: guard
        name: Kill switch, then validate the inputs
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          IN_SHARD_ID: ${{ inputs.shard_id }}
          IN_ATTEMPT_ID: ${{ inputs.attempt_id }}
          IN_FENCE: ${{ inputs.fence }}
          IN_RUN_KEY: ${{ inputs.run_key }}
        run: |
          if [ "$LOOP_ENABLED" != "true" ]; then
            echo "::notice::LOOP_ENABLED is not 'true'; this T0 worker does nothing."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bad=0
          check() { # name value pattern
            # [[ =~ ]] matches the whole string, so a value with a newline is refused (grep matched line by line).
            if ! [[ "$2" =~ $3 ]]; then echo "::error::input $1 is empty or has a character outside its allowed set"; bad=1; fi
          }
          check shard_id "$IN_SHARD_ID" '^[A-Za-z0-9._-]{1,64}$'
          check attempt_id "$IN_ATTEMPT_ID" '^[A-Za-z0-9._-]{1,64}$'
          check fence "$IN_FENCE" '^[A-Za-z0-9._:-]{1,64}$'
          check run_key "$IN_RUN_KEY" '^[A-Za-z0-9._:-]{1,64}$'
          [ "$bad" -eq 0 ] || exit 1
          {
            echo "go=true"
            echo "attempt_id=$IN_ATTEMPT_ID"
            echo "fence=$IN_FENCE"
            echo "run_key=$IN_RUN_KEY"
          } >> "$GITHUB_OUTPUT"

  clean:
    needs: t0-start
    permissions:
      contents: read
    if: needs.t0-start.outputs.go == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAN_HASH: d8ef7bb920c95d06
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tiny-tracker ref is a full commit SHA
        env:
          NAME: tiny-tracker-ref
          REF: ${{ env.TT_REF }}
        run: dogfood/check-ref.sh
      - name: Check out tiny-tracker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ env.TT_REF }}
          path: tt
          sparse-checkout: examples/tiny-tracker
          persist-credentials: false
      - name: The CLI commit's own tiny-tracker manifest (manifest-from-cli)
        if: inputs.manifest-from-cli
        env:
          NAME: cli-ref (manifest-from-cli needs it)
          REF: ${{ inputs.cli-ref }}
        run: dogfood/check-ref.sh
      - name: Check out that manifest
        if: inputs.manifest-from-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ inputs.cli-ref }}
          path: mwsm
          sparse-checkout: examples/tiny-tracker/writecheck.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Use it
        if: inputs.manifest-from-cli
        run: dogfood/tiny-tracker/manifest-from-cli.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build tiny-tracker
        working-directory: tt/examples/tiny-tracker
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: The defect matrix lists every defect of this tiny-tracker
        if: inputs.tiny-tracker-ref == ''
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { DEFECTS } = await import(process.cwd() + "/tt/examples/tiny-tracker/dist/src/start.js");
            const listed = new Set(JSON.parse(readFileSync("dogfood/tiny-tracker/defects.json", "utf8")).cells.map((c) => c.defect));
            const missing = DEFECTS.map((d) => d.name).filter((n) => !listed.has(n));
            const extra = [...listed].filter((n) => !DEFECTS.some((d) => d.name === n));
            if (missing.length || extra.length) { console.log("::error::defects.json and tiny-tracker differ: missing " + missing.join(", ") + "; not in tiny-tracker " + extra.join(", ")); process.exit(1); }
            console.log("the matrix lists all " + DEFECTS.length + " defects");
          '
      - name: Start the tiny-tracker backend
        run: dogfood/tiny-tracker/backend.sh start
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: ${{ env.TT_MANIFEST }}
          mode: plan
          artifact-name: tiny-tracker-clean-plan
          cli-ref: ${{ inputs.cli-ref }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" clean
      - name: Catalog
        uses: ./
        with:
          manifest: ${{ env.TT_MANIFEST }}
          mode: catalog
          fail-on: must
          artifact-name: tiny-tracker-clean-catalog
          cli-ref: ${{ inputs.cli-ref }}
      - name: Full run
        uses: ./
        with:
          manifest: ${{ env.TT_MANIFEST }}
          mode: full
          fail-on: must
          confirm-target: tiny-tracker
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: tiny-tracker-clean-full
          cli-ref: ${{ inputs.cli-ref }}
      - name: Stop the backend
        if: always()
        run: dogfood/tiny-tracker/backend.sh stop

  defects:
    needs: t0-start
    permissions:
      contents: read
    if: needs.t0-start.outputs.go == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAN_HASH: 4e20793edef7d70c
      TRACKER_DEFECTS: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tiny-tracker ref is a full commit SHA
        env:
          NAME: tiny-tracker-ref
          REF: ${{ env.TT_REF }}
        run: dogfood/check-ref.sh
      - name: Check out tiny-tracker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ env.TT_REF }}
          path: tt
          sparse-checkout: examples/tiny-tracker
          persist-credentials: false
      - name: The CLI commit's own tiny-tracker manifest (manifest-from-cli)
        if: inputs.manifest-from-cli
        env:
          NAME: cli-ref (manifest-from-cli needs it)
          REF: ${{ inputs.cli-ref }}
        run: dogfood/check-ref.sh
      - name: Check out that manifest
        if: inputs.manifest-from-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ inputs.cli-ref }}
          path: mwsm
          sparse-checkout: examples/tiny-tracker/writecheck.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Use it
        if: inputs.manifest-from-cli
        run: dogfood/tiny-tracker/manifest-from-cli.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build tiny-tracker
        working-directory: tt/examples/tiny-tracker
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Start the tiny-tracker backend
        run: dogfood/tiny-tracker/backend.sh start
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: ${{ env.TT_MANIFEST }}
          mode: plan
          artifact-name: tiny-tracker-defects-plan
          cli-ref: ${{ inputs.cli-ref }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" defects
      - id: full
        name: Full run (expected to fail)
        continue-on-error: true
        uses: ./
        with:
          manifest: ${{ env.TT_MANIFEST }}
          mode: full
          fail-on: must
          confirm-target: tiny-tracker
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: tiny-tracker-defects-full
          cli-ref: ${{ inputs.cli-ref }}
      - name: The action must have failed the run on violated MUST records
        env:
          OUTCOME: ${{ steps.full.outcome }}
          EXIT_STATUS: ${{ steps.full.outputs.exit-status }}
          CLI_EXIT: ${{ steps.full.outputs.cli-exit-code }}
          RESULTS: ${{ steps.full.outputs.results-path }}
        run: dogfood/tiny-tracker/expect-defects.sh
      - name: Stop the backend
        if: always()
        run: dogfood/tiny-tracker/backend.sh stop

  defect-list:
    needs: t0-start
    permissions:
      contents: read
    if: needs.t0-start.outputs.go == 'true' && (inputs.cli-ref == '' && inputs.tiny-tracker-ref == '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cells: ${{ steps.cells.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: dogfood/tiny-tracker/defects.json
          sparse-checkout-cone-mode: false
      - id: cells
        run: |
          node -e '
            const c = JSON.parse(require("fs").readFileSync("dogfood/tiny-tracker/defects.json", "utf8")).cells;
            if (!Array.isArray(c) || c.length === 0 || new Set(c.map((x) => x.defect)).size !== c.length) { console.error("cells must be a non-empty list of distinct defects"); process.exit(1); }
            for (const x of c) if (!/^[a-z0-9-]+$/.test(x.defect) || !/^MWS-[A-Z]+-[0-9]+$/.test(x.requirement) || !/^[0-9a-f]{16}$/.test(x.plan_hash) || !["detected", "missed"].includes(x.expect)) { console.error("bad cell", JSON.stringify(x)); process.exit(1); }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "cells=" + JSON.stringify(c) + "\n");
          '

  defect:
    permissions:
      contents: read
    needs: [t0-start, defect-list]
    if: needs.t0-start.outputs.go == 'true' && (inputs.cli-ref == '' && inputs.tiny-tracker-ref == '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    name: defect ${{ matrix.defect }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.defect-list.outputs.cells) }}
    env:
      TRACKER_DEFECTS: ${{ matrix.defect }}
      PLAN_HASH: ${{ matrix.plan_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tiny-tracker ref is a full commit SHA
        env:
          NAME: tiny-tracker-ref
          REF: ${{ env.TT_REF }}
        run: dogfood/check-ref.sh
      - name: Check out tiny-tracker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ env.TT_REF }}
          path: tt
          sparse-checkout: examples/tiny-tracker
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build tiny-tracker
        working-directory: tt/examples/tiny-tracker
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Start the tiny-tracker backend
        run: dogfood/tiny-tracker/backend.sh start
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: ${{ env.TT_MANIFEST }}
          mode: plan
          artifact-name: tiny-tracker-defect-${{ matrix.defect }}-plan
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN"
      - id: full
        name: Full run (fail-on none; the next step decides)
        uses: ./
        with:
          manifest: ${{ env.TT_MANIFEST }}
          mode: full
          fail-on: none
          confirm-target: tiny-tracker
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: tiny-tracker-defect-${{ matrix.defect }}-full
      - name: Was the defect detected?
        if: always() && steps.full.outputs.results-path != ''
        env:
          DEFECT: ${{ matrix.defect }}
          REQUIREMENT: ${{ matrix.requirement }}
          EXPECT: ${{ matrix.expect }}
          RESULTS: ${{ steps.full.outputs.results-path }}
        run: node dogfood/tiny-tracker/expect-defect.mjs "$RESULTS"
      - name: Stop the backend
        if: always()
        run: dogfood/tiny-tracker/backend.sh stop

  traps:
    needs: t0-start
    permissions:
      contents: read
    if: needs.t0-start.outputs.go == 'true' && (inputs.tiny-tracker-ref == '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tiny-tracker ref is a full commit SHA
        env:
          NAME: tiny-tracker-ref
          REF: ${{ env.TT_REF }}
        run: dogfood/check-ref.sh
      - name: Check out tiny-tracker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ env.TT_REF }}
          path: tt
          sparse-checkout: examples/tiny-tracker
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build tiny-tracker
        working-directory: tt/examples/tiny-tracker
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      # Trap 1: the backend crashes during the run.
      - name: Start the tiny-tracker backend
        run: dogfood/tiny-tracker/backend.sh start
      - id: plan-crash
        name: Plan (backend-crash)
        uses: ./
        with:
          manifest: dogfood/tiny-tracker/writecheck.yaml
          mode: plan
          artifact-name: tiny-tracker-trap-crash-plan
          cli-ref: ${{ inputs.cli-ref }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan-crash.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh d8ef7bb920c95d06 "$SEEN" crash
      - name: Arm the crash (kills the backend once the run is under way)
        run: |
          nohup dogfood/tiny-tracker/crash-backend.sh mwsc-crash > "$RUNNER_TEMP/crash.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/crash-watcher.pid"
      - id: crash
        name: Full run, backend killed during it
        continue-on-error: true
        uses: ./
        with:
          manifest: dogfood/tiny-tracker/writecheck.yaml
          mode: full
          fail-on: none
          confirm-target: tiny-tracker
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          results-dir: mwsc-crash
          artifact-name: tiny-tracker-trap-crash-full
          cli-ref: ${{ inputs.cli-ref }}
      - name: Trap backend-crash
        if: always()
        env:
          TRAP: backend-crash
          CLI_EXIT: ${{ steps.crash.outputs.cli-exit-code }}
          EXIT_STATUS: ${{ steps.crash.outputs.exit-status }}
          RESULTS: ${{ steps.crash.outputs.results-path }}
        run: |
          kill "$(cat "$RUNNER_TEMP/crash-watcher.pid")" 2>/dev/null || true
          CRASH_LOG="$RUNNER_TEMP/crash.log" dogfood/tiny-tracker/expect-trap.sh
      # Trap 2: every resource's set-up fails.
      - name: Start a fresh backend
        if: always()
        run: dogfood/tiny-tracker/backend.sh stop; dogfood/tiny-tracker/backend.sh start
      - id: plan-setup
        name: Plan (setup-fails)
        uses: ./
        with:
          manifest: dogfood/tiny-tracker/writecheck-setup-fails.yaml
          mode: plan
          artifact-name: tiny-tracker-trap-setup-plan
          cli-ref: ${{ inputs.cli-ref }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan-setup.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh 7b794b130df14621 "$SEEN" setup
      - id: setup
        name: Full run, every set-up failing
        continue-on-error: true
        uses: ./
        with:
          manifest: dogfood/tiny-tracker/writecheck-setup-fails.yaml
          mode: full
          fail-on: none
          confirm-target: tiny-tracker
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          results-dir: mwsc-setup
          artifact-name: tiny-tracker-trap-setup-full
          cli-ref: ${{ inputs.cli-ref }}
      - name: Trap setup-fails
        if: always()
        env:
          TRAP: setup-fails
          CLI_EXIT: ${{ steps.setup.outputs.cli-exit-code }}
          EXIT_STATUS: ${{ steps.setup.outputs.exit-status }}
          RESULTS: ${{ steps.setup.outputs.results-path }}
        run: dogfood/tiny-tracker/expect-trap.sh
      - name: Stop the backend
        if: always()
        run: dogfood/tiny-tracker/backend.sh stop

  t0-manifest:
    needs: [t0-start, clean, defects, defect-list, defect, traps]
    if: ${{ always() && needs.t0-start.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Runs none of the workflow's code: it only reads the jobs' results (and, for a failed run, which steps failed) and builds the sealed bundle.
    permissions:
      contents: read
      actions: read # the failed steps of this run, to tell infrastructure from our tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the result bundle
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          node loop/t0-bundle.mjs --out "$RUNNER_TEMP/out"
      - uses: isokron-ai/tool-qa/worker-kit@b04b7c65c244de48c32f93c7ea9b9ac933ca1efe # tool-qa main, 27 Nov 2026 (T0_WORKER_KIT_REF)
        with:
          bundle-dir: ${{ runner.temp }}/out/bundle
          meta-file: ${{ runner.temp }}/out/meta.json
          attempt-id: ${{ needs.t0-start.outputs.attempt_id }}
          item-index: 0
          fence: ${{ needs.t0-start.outputs.fence }}
          run-key: ${{ needs.t0-start.outputs.run_key }}
