# Dogfood: this action against tiny-tracker, the MWS sample server, every night and on demand.
#
#   clean    tiny-tracker as published (no defect switched on): plan, catalog, then a full run with
#            fail-on: must. Expected green.
#   defects  the same server with every teaching defect on (TRACKER_DEFECTS=all). The action must FAIL
#            this job's run step; the job itself passes only when it does, with violated records.
#   defect   a matrix, one tiny-tracker defect per cell (dogfood/tiny-tracker/defects.json): each cell
#            expects a violated record of its defect's requirement, or is a known miss of the CLI
#            (an expected failure, flipped when the CLI detects it). Pinned CLI only: a cli-ref
#            dispatch skips it (its plans would need one accepted hash per cell).
#
# The plan hashes below were read and accepted by a person (the action's rule: never take a hash
# from a plan job's output). When tiny-tracker, the manifest or the CLI pin changes, the full run is
# refused with a hash mismatch: read the new plan in the plan step's summary and update the hash.
#
# Security: no pull_request_target. A pull request from a fork runs nothing here (each job's `if:`), so
# a fork never gets MWS_CLI_TOKEN. That secret is read-only on isokron-ai/mcp-write-safety and is used
# for the CLI fetch and the tiny-tracker checkout. Third-party actions are pinned by full SHA.

name: "dogfood: tiny-tracker"

on:
  workflow_dispatch:
    inputs:
      cli-ref:
        description: mcp-writecheck commit to test with (full 40-character SHA). Empty for the action's default.
        required: false
        default: ''
      tiny-tracker-ref:
        description: tiny-tracker commit of isokron-ai/mcp-write-safety (full SHA). Empty for the pinned one.
        required: false
        default: ''
      manifest-from-cli:
        description: Use the tiny-tracker manifest of the cli-ref commit (needs cli-ref) instead of dogfood/tiny-tracker/writecheck.yaml. The server is still built from tiny-tracker-ref.
        type: boolean
        required: false
        default: false
      plan-hashes:
        description: "Accepted plan hashes for that CLI, after reading the plans: space-separated job=hash pairs (jobs: clean, defects)."
        required: false
        default: ''
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths: ['dogfood/tiny-tracker/**', 'dogfood/*.sh', '.github/workflows/dogfood-tiny-tracker.yml', 'action.yml', 'contract.mjs', 'src/**']
  push:
    branches: [main]
    paths: ['dogfood/tiny-tracker/**', 'dogfood/*.sh', '.github/workflows/dogfood-tiny-tracker.yml', 'action.yml', 'contract.mjs', 'src/**']

permissions:
  contents: read

concurrency:
  group: dogfood-tiny-tracker-${{ github.ref }}
  cancel-in-progress: false

env:
  # tiny-tracker examples/tiny-tracker-resync (PR #7 of isokron-ai/mcp-write-safety).
  TT_REF: ${{ inputs.tiny-tracker-ref || 'b9265fe3d768a40f316837cf31528e856ff809d8' }}
  PLAN_HASHES: ${{ inputs.plan-hashes }}
  TT_MANIFEST: dogfood/tiny-tracker/writecheck.yaml
  # The same backend URL in every step, so that every step arrives at the same plan hash.
  TRACKER_BACKEND_URL: http://127.0.0.1:4610

jobs:
  clean:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAN_HASH: 1cd00c43789a075f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tiny-tracker ref is a full commit SHA
        env:
          NAME: tiny-tracker-ref
          REF: ${{ env.TT_REF }}
        run: dogfood/check-ref.sh
      - name: Check out tiny-tracker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ env.TT_REF }}
          token: ${{ secrets.MWS_CLI_TOKEN }}
          path: tt
          sparse-checkout: examples/tiny-tracker
          persist-credentials: false
      - name: The CLI commit's own tiny-tracker manifest (manifest-from-cli)
        if: inputs.manifest-from-cli
        env:
          NAME: cli-ref (manifest-from-cli needs it)
          REF: ${{ inputs.cli-ref }}
        run: dogfood/check-ref.sh
      - name: Check out that manifest
        if: inputs.manifest-from-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ inputs.cli-ref }}
          token: ${{ secrets.MWS_CLI_TOKEN }}
          path: mwsm
          sparse-checkout: examples/tiny-tracker/writecheck.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Use it
        if: inputs.manifest-from-cli
        run: dogfood/tiny-tracker/manifest-from-cli.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build tiny-tracker
        working-directory: tt/examples/tiny-tracker
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Start the tiny-tracker backend
        run: dogfood/tiny-tracker/backend.sh start
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: ${{ env.TT_MANIFEST }}
          mode: plan
          artifact-name: tiny-tracker-clean-plan
          cli-ref: ${{ inputs.cli-ref }}
          cli-token: ${{ secrets.MWS_CLI_TOKEN }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" clean
      - name: Catalog
        uses: ./
        with:
          manifest: ${{ env.TT_MANIFEST }}
          mode: catalog
          fail-on: must
          artifact-name: tiny-tracker-clean-catalog
          cli-ref: ${{ inputs.cli-ref }}
          cli-token: ${{ secrets.MWS_CLI_TOKEN }}
      - name: Full run
        uses: ./
        with:
          manifest: ${{ env.TT_MANIFEST }}
          mode: full
          fail-on: must
          confirm-target: tiny-tracker
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: tiny-tracker-clean-full
          cli-ref: ${{ inputs.cli-ref }}
          cli-token: ${{ secrets.MWS_CLI_TOKEN }}
      - name: Stop the backend
        if: always()
        run: dogfood/tiny-tracker/backend.sh stop

  defects:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAN_HASH: d611779dfe2ef06a
      TRACKER_DEFECTS: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tiny-tracker ref is a full commit SHA
        env:
          NAME: tiny-tracker-ref
          REF: ${{ env.TT_REF }}
        run: dogfood/check-ref.sh
      - name: Check out tiny-tracker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ env.TT_REF }}
          token: ${{ secrets.MWS_CLI_TOKEN }}
          path: tt
          sparse-checkout: examples/tiny-tracker
          persist-credentials: false
      - name: The CLI commit's own tiny-tracker manifest (manifest-from-cli)
        if: inputs.manifest-from-cli
        env:
          NAME: cli-ref (manifest-from-cli needs it)
          REF: ${{ inputs.cli-ref }}
        run: dogfood/check-ref.sh
      - name: Check out that manifest
        if: inputs.manifest-from-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ inputs.cli-ref }}
          token: ${{ secrets.MWS_CLI_TOKEN }}
          path: mwsm
          sparse-checkout: examples/tiny-tracker/writecheck.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Use it
        if: inputs.manifest-from-cli
        run: dogfood/tiny-tracker/manifest-from-cli.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build tiny-tracker
        working-directory: tt/examples/tiny-tracker
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Start the tiny-tracker backend
        run: dogfood/tiny-tracker/backend.sh start
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: ${{ env.TT_MANIFEST }}
          mode: plan
          artifact-name: tiny-tracker-defects-plan
          cli-ref: ${{ inputs.cli-ref }}
          cli-token: ${{ secrets.MWS_CLI_TOKEN }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" defects
      - id: full
        name: Full run (expected to fail)
        continue-on-error: true
        uses: ./
        with:
          manifest: ${{ env.TT_MANIFEST }}
          mode: full
          fail-on: must
          confirm-target: tiny-tracker
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: tiny-tracker-defects-full
          cli-ref: ${{ inputs.cli-ref }}
          cli-token: ${{ secrets.MWS_CLI_TOKEN }}
      - name: The action must have failed the run on violated MUST records
        env:
          OUTCOME: ${{ steps.full.outcome }}
          EXIT_STATUS: ${{ steps.full.outputs.exit-status }}
          CLI_EXIT: ${{ steps.full.outputs.cli-exit-code }}
          RESULTS: ${{ steps.full.outputs.results-path }}
        run: dogfood/tiny-tracker/expect-defects.sh
      - name: Stop the backend
        if: always()
        run: dogfood/tiny-tracker/backend.sh stop

  defect-list:
    if: inputs.cli-ref == '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cells: ${{ steps.cells.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: dogfood/tiny-tracker/defects.json
          sparse-checkout-cone-mode: false
      - id: cells
        run: |
          node -e '
            const c = JSON.parse(require("fs").readFileSync("dogfood/tiny-tracker/defects.json", "utf8")).cells;
            for (const x of c) if (!/^[a-z0-9-]+$/.test(x.defect) || !/^MWS-[A-Z]+-[0-9]+$/.test(x.requirement) || !/^[0-9a-f]{16}$/.test(x.plan_hash) || !["detected", "missed"].includes(x.expect)) { console.error("bad cell", JSON.stringify(x)); process.exit(1); }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "cells=" + JSON.stringify(c) + "\n");
          '

  defect:
    needs: defect-list
    name: defect ${{ matrix.defect }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.defect-list.outputs.cells) }}
    env:
      TRACKER_DEFECTS: ${{ matrix.defect }}
      PLAN_HASH: ${{ matrix.plan_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tiny-tracker ref is a full commit SHA
        env:
          NAME: tiny-tracker-ref
          REF: ${{ env.TT_REF }}
        run: dogfood/check-ref.sh
      - name: Check out tiny-tracker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ env.TT_REF }}
          token: ${{ secrets.MWS_CLI_TOKEN }}
          path: tt
          sparse-checkout: examples/tiny-tracker
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build tiny-tracker
        working-directory: tt/examples/tiny-tracker
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Start the tiny-tracker backend
        run: dogfood/tiny-tracker/backend.sh start
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: ${{ env.TT_MANIFEST }}
          mode: plan
          artifact-name: tiny-tracker-defect-${{ matrix.defect }}-plan
          cli-token: ${{ secrets.MWS_CLI_TOKEN }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN"
      - id: full
        name: Full run (fail-on none; the next step decides)
        uses: ./
        with:
          manifest: ${{ env.TT_MANIFEST }}
          mode: full
          fail-on: none
          confirm-target: tiny-tracker
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: tiny-tracker-defect-${{ matrix.defect }}-full
          cli-token: ${{ secrets.MWS_CLI_TOKEN }}
      - name: Was the defect detected?
        if: always() && steps.full.outputs.results-path != ''
        env:
          DEFECT: ${{ matrix.defect }}
          REQUIREMENT: ${{ matrix.requirement }}
          EXPECT: ${{ matrix.expect }}
          RESULTS: ${{ steps.full.outputs.results-path }}
        run: node dogfood/tiny-tracker/expect-defect.mjs "$RESULTS"
      - name: Stop the backend
        if: always()
        run: dogfood/tiny-tracker/backend.sh stop
